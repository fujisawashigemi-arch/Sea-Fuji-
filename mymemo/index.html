
<!doctype html>
<html lang="ja">
<head>
<link rel="apple-touch-icon" href="./mymemoicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f3ee">
<title>メモル｜オトリス</title>

<style>
:root{
  --bg:#f6f3ee;--paper:#fff;--ink:#292722;
  --muted:#89847b;--line:#e8e2d9;
  --green:#718b70;--green-dark:#536d52;
  --green-light:#edf2eb;--danger:#b65f58;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  line-height:1.6;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
[hidden]{display:none!important}

header{
  position:sticky;top:0;z-index:10;
  background:rgba(246,243,238,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:14px 16px 12px;
}
.header-inner{
  max-width:760px;margin:auto;display:flex;
  align-items:center;justify-content:space-between;gap:12px;
}
.brand{font-size:22px;font-weight:800;letter-spacing:.04em}
.brand small{
  display:block;font-size:10px;color:var(--muted);
  font-weight:500;letter-spacing:.16em;line-height:1.2;
}
.version{
  display:block;font-size:9px;color:var(--muted);
  font-weight:400;letter-spacing:.05em;line-height:1.4;
  margin-top:2px;
}
.header-actions{display:flex;gap:7px;flex-wrap:wrap}

main{max-width:760px;margin:0 auto;padding:18px 14px 60px}
.panel{
  background:var(--paper);border:1px solid var(--line);
  border-radius:14px;padding:15px;margin-bottom:15px;
}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:16px 0 8px}
label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}
input[type="text"],textarea,select{
  width:100%;border:1px solid var(--line);border-radius:9px;
  padding:10px 11px;background:#fff;color:var(--ink);outline:none;
}
input:focus,textarea:focus,select:focus{
  border-color:var(--green);box-shadow:0 0 0 3px rgba(113,139,112,.12);
}
textarea{min-height:180px;resize:vertical}
button{
  border:0;border-radius:9px;padding:9px 13px;
  background:var(--green);color:#fff;font-weight:650;
}
button.secondary{background:var(--green-light);color:var(--green-dark)}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
button.danger{background:#f8ecea;color:var(--danger)}
button.small{font-size:12px;padding:6px 9px}
button:disabled{opacity:.4;cursor:not-allowed}

.filter-toggle{
  width:100%;display:flex;align-items:center;
  justify-content:space-between;gap:10px;padding:0;margin:0;
  background:transparent;color:var(--ink);border:0;
  border-radius:0;font-size:16px;font-weight:750;text-align:left;
}
.filter-toggle:active{transform:none}
.filter-toggle-icon{color:var(--green-dark);font-size:13px}
.filter-content{padding-top:12px}

.form-actions,.view-actions{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;
}
.tag-entry{display:flex;gap:7px;margin-top:10px}
.tag-entry input{flex:1;min-width:0}
.tag-picker,.tag-list,.filter-tags{
  display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;
}
.tag-choice{
  border:1px solid var(--line);background:#fff;color:var(--muted);
  border-radius:20px;padding:6px 11px;font-size:12px;
}
.tag-choice.active{background:var(--green);border-color:var(--green);color:#fff}
.tag{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--green-light);color:var(--green-dark);
  border-radius:20px;padding:4px 9px;font-size:12px;white-space:nowrap;
}
.tag button{
  padding:0;background:transparent;color:var(--green-dark);
  font-size:14px;line-height:1;
}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}

.search-row{display:flex;gap:8px;align-items:center}
.search-row input{flex:1;min-width:0}
.filter-tag{
  background:#fff;color:var(--muted);border:1px solid var(--line);
  border-radius:20px;padding:6px 11px;font-size:12px;
}
.filter-tag.active{background:var(--green);color:#fff;border-color:var(--green)}
.filter-options{
  display:flex;align-items:center;flex-wrap:wrap;
  gap:12px;margin-top:12px;font-size:13px;color:var(--muted);
}
.filter-options label{
  display:inline-flex;align-items:center;gap:5px;
  margin:0;font-weight:500;
}
.filter-options input{accent-color:var(--green)}

.section-heading{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin:22px 2px 10px;
}
.section-heading h2{margin:0}
.count{color:var(--muted);font-size:12px}

.sort-tools,.select-tools{
  display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  margin:0 0 12px;
}
.sort-tools label{margin:0;font-size:12px;color:var(--muted);font-weight:650}
.sort-tools select{width:auto;min-width:110px;flex:1;padding:7px 9px;font-size:12px}
.selected-count{font-size:12px;color:var(--green-dark);font-weight:650}

.tablewrap{
  width:100%;max-height:65vh;overflow:auto;background:var(--paper);
  border:1px solid var(--line);border-radius:10px;
  -webkit-overflow-scrolling:touch;
}
.memo-table{
  width:100%;min-width:790px;border-collapse:separate;
  border-spacing:0;table-layout:fixed;font-size:12px;
}
.memo-table th,.memo-table td{
  padding:9px 8px;border-bottom:1px solid var(--line);
  border-right:1px solid #f0ece6;text-align:left;
  vertical-align:middle;background:#fff;
}
.memo-table th{
  position:sticky;top:0;z-index:3;background:#faf9f7;
  color:#6f6a61;font-weight:700;white-space:nowrap;
}
.memo-table tr:last-child td{border-bottom:0}
.memo-table th:last-child,.memo-table td:last-child{border-right:0}
.memo-table .check-col{
  width:36px;min-width:36px;max-width:36px;text-align:center;
  position:sticky;left:0;z-index:4;background:#faf9f7;
}
.memo-table td.check-col{background:#fff}
.memo-table .title-col{
  width:145px;min-width:145px;max-width:145px;
  position:sticky;left:36px;z-index:2;background:#fff;
}
.memo-table th.title-col{z-index:6;background:#faf9f7}
.memo-table .body-col{width:230px}
.memo-table .date-col{width:145px}
.memo-table .tags-col{width:145px}
.memo-table td.title-col{font-weight:700;cursor:pointer}
.memo-table td.body-col{color:#777168;cursor:pointer}
.memo-table td.title-col,.memo-table td.body-col{
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.memo-table td.tags-col{overflow:hidden}
.memo-table .row-tags{display:flex;gap:4px;overflow:hidden;white-space:nowrap}
.memo-table .tag{font-size:10px;padding:3px 7px}
.memo-table .date-col{color:#777168;font-size:11px;white-space:nowrap}
.memo-table tbody tr:hover td{background:#faf9f6}
.memo-table tbody tr:hover td.check-col,
.memo-table tbody tr:hover td.title-col{background:#f6f5f1}
.memo-table input[type="checkbox"]{
  width:17px;height:17px;accent-color:var(--green);vertical-align:middle;
}
.table-empty{padding:30px 12px;text-align:center;color:var(--muted);font-size:13px}

.bulk-panel{
  background:var(--green-light);border:1px solid #dce6d9;
  border-radius:12px;padding:13px;margin-bottom:12px;
}
.bulk-panel h3{margin:0 0 8px;color:var(--green-dark)}
.bulk-row{display:flex;gap:7px;align-items:center;margin-top:8px}
.bulk-row select,.bulk-row input{flex:1;min-width:0}
.bulk-row button{white-space:nowrap}

.view-title{font-size:21px;line-height:1.5;margin:0 0 16px;overflow-wrap:anywhere}
.view-body{
  white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;
  line-height:1.9;min-height:40px;
}
.view-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.view-date{
  font-size:11px;color:var(--muted);border-top:1px solid var(--line);
  padding-top:12px;margin-top:20px;
}
details summary{cursor:pointer;color:var(--green-dark);font-size:13px;font-weight:650}
details .details-content{padding-top:10px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
footer{text-align:center;color:#aaa399;font-size:11px;padding:24px 0 8px}
@media(max-width:420px){
  main{padding-left:10px;padding-right:10px}
  .header-actions{gap:4px}
  .header-actions button{padding:6px 8px;font-size:11px}
}
</style>
</head>

<body>

<div id="appShell">
<header>
  <div class="header-inner">
    <div class="brand">メモル<small>OTOLIS</small><span class="version">Ver.1.1.0</span></div>
    <div class="header-actions">
      <button class="secondary small" id="backupBtn">バックアップ</button>
      <button class="ghost small" id="restoreBtn">復元</button>
      <input type="file" id="restoreFile" accept=".json,application/json" hidden>
    </div>
  </div>
</header>

<main>
  <section class="panel" id="editor" hidden>
    <h2 id="formHeading">＋ メモを追加</h2>
    <label for="memoTitle">タイトル（任意）</label>
    <input type="text" id="memoTitle" placeholder="タイトルを入力">
    <label for="memoBody">本文</label>
    <textarea id="memoBody" placeholder="メモしたいことを書いてね"></textarea>
    <label>タグ</label>
    <div class="tag-picker" id="memoTagPicker"></div>
    <div class="tag-entry">
      <input type="text" id="memoTagInput" placeholder="新しいタグ名">
      <button type="button" id="addMemoTag">追加</button>
    </div>
    <p class="note">登録済みのタグを選ぶか、新しいタグを追加できるよ。</p>
    <div class="form-actions">
      <button id="saveMemo">保存する</button>
      <button class="ghost" id="cancelEdit">キャンセル</button>
    </div>
  </section>

  <section class="panel" id="detailView" hidden>
    <h2>メモの内容</h2>
    <h1 class="view-title" id="viewTitle"></h1>
    <div class="view-body" id="viewBody"></div>
    <div class="view-tags" id="viewTags"></div>
    <div class="view-date" id="viewDate"></div>
    <div class="view-actions">
      <button class="secondary" id="copyBodyBtn">本文をすべてコピー</button>
      <button id="viewEditBtn">編集する</button>
      <button class="ghost" id="backToListBtn">一覧に戻る</button>
      <button class="danger small" id="viewDeleteBtn">削除</button>
    </div>
  </section>

  <section id="listScreen">
    <section class="panel">
      <button id="newMemoBtn">＋ 新しいメモを作る</button>
    </section>

    <section class="panel">
      <button type="button" class="filter-toggle" id="filterToggle"
        aria-expanded="true" aria-controls="filterContent">
        <span>メモを探す</span><span class="filter-toggle-icon" id="filterToggleIcon">▼</span>
      </button>
      <div class="filter-content" id="filterContent">
        <div class="search-row">
          <input type="text" id="keyword" placeholder="キーワードで検索">
          <button class="ghost small" id="clearSearch">クリア</button>
        </div>
        <h3>タグで絞り込み</h3>
        <div class="filter-tags" id="filterTagList"></div>
        <div class="filter-options">
          <span>タグの検索方法：</span>
          <label><input type="radio" name="tagMode" value="or" checked> OR（どれか）</label>
          <label><input type="radio" name="tagMode" value="and"> AND（すべて）</label>
          <button class="ghost small" id="clearTags">タグ解除</button>
        </div>
      </div>
    </section>

    <section>
      <div class="section-heading">
        <h2>メモ一覧</h2><span class="count" id="memoCount"></span>
      </div>
      <div class="sort-tools">
        <label for="sortKey">並べ替え</label>
        <select id="sortKey">
          <option value="createdAt">作成日</option>
          <option value="updatedAt">更新日</option>
          <option value="title">タイトル</option>
        </select>
        <select id="sortOrder" aria-label="並べ替え順">
          <option value="desc">降順</option>
          <option value="asc">昇順</option>
        </select>
      </div>
      <div class="select-tools">
        <button class="secondary small" id="toggleSelectBtn">複数選択</button>
        <span class="selected-count" id="selectedCount" hidden>0件選択中</span>
        <button class="ghost small" id="selectAllBtn" hidden>表示中をすべて選択</button>
        <button class="ghost small" id="clearSelectionBtn" hidden>選択解除</button>
      </div>
      <section class="bulk-panel" id="bulkPanel" hidden>
        <h3>選択したメモのタグを一括操作</h3>
        <div class="bulk-row">
          <select id="bulkAddTag"><option value="">追加するタグを選択</option></select>
          <button class="small" id="bulkAddBtn">一括追加</button>
        </div>
        <div class="bulk-row">
          <input type="text" id="bulkNewTag" placeholder="新しいタグを作って追加">
          <button class="small" id="bulkNewTagBtn">作成・追加</button>
        </div>
        <hr>
        <div class="bulk-row">
          <select id="bulkRemoveTag"><option value="">外すタグを選択</option></select>
          <button class="danger small" id="bulkRemoveBtn">一括解除</button>
        </div>
        <p class="note">選択したメモだけに反映されるよ。</p>
      </section>
      <div class="tablewrap" id="tablewrap"><div id="memoList"></div></div>
    </section>

    <section class="panel" style="margin-top:22px">
      <details>
        <summary>タグの管理</summary>
        <div class="details-content">
          <p class="note">登録済みタグの名前を変更したり、削除したりできるよ。</p>
          <div id="manageTagList" class="tag-list"></div>
          <p class="note">タグを削除すると、そのタグはメモからも外れるよ。</p>
        </div>
      </details>
    </section>
  </section>
  <footer>OTOLIS · MEMORU</footer>
</main>
</div>

<script>
"use strict";

/*
  メモル Ver.1.1.0
  パスワードなし・端末内保存版

  新しい保存先：
  myMemoruLocal_v1

  旧バージョンの暗号化データ：
  myMemoEncrypted_v1

  旧バージョンの通常データ：
  myMemoList_v1
*/

const STORAGE_KEY = "myMemoruLocal_v1";
const OLD_ENCRYPTED_KEY = "myMemoEncrypted_v1";
const OLD_STORAGE_KEY = "myMemoList_v1";

let memos = [];
let allTags = [];
let editingId = null;
let viewingId = null;
let draftTags = [];
let selectedTags = [];
let selectionMode = false;
let selectedMemoIds = [];

const $ = id => document.getElementById(id);

/* ID作成 */
function makeId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

/* HTMLエスケープ */
function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

/* 日付表示 */
function formatDate(time){
  return new Date(time).toLocaleString("ja-JP",{
    year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit"
  });
}

/* データ整形 */
function normalizeData(data){
  memos = (Array.isArray(data.memos) ? data.memos : []).map(m => ({
    id:String(m.id || makeId()),
    title:String(m.title || ""),
    body:String(m.body || ""),
    tags:Array.isArray(m.tags) ? m.tags.map(String) : [],
    createdAt:Number(m.createdAt) || Date.now(),
    updatedAt:Number(m.updatedAt) || Number(m.createdAt) || Date.now()
  }));

  allTags = Array.isArray(data.tags) ? data.tags.map(String) : [];
  syncAllTags();
}

/* タグを同期 */
function syncAllTags(){
  const used = memos.flatMap(m => m.tags || []);
  allTags = [...new Set([...allTags,...used])].filter(Boolean);
}

/* 端末内へ通常保存 */
function saveData(){
  const data = {
    version:1,
    app:"otolis-memor u",
    memos,
    tags:allTags,
    updatedAt:new Date().toISOString()
  };

  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

/* 端末内データ読み込み */
function loadLocalData(){
  const stored = localStorage.getItem(STORAGE_KEY);
  if(!stored) return false;

  const data = JSON.parse(stored);
  normalizeData(data);
  return true;
}

/* Base64変換 */
function fromBase64(value){
  const binary = atob(value);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

/* 旧暗号化データの復号 */
async function decryptOldVault(record,key){
  if(!record || !record.iv || !record.ciphertext){
    throw new Error("旧データの形式が違います");
  }

  const decrypted = await crypto.subtle.decrypt(
    {name:"AES-GCM",iv:fromBase64(record.iv)},
    key,
    fromBase64(record.ciphertext)
  );

  const data = JSON.parse(new TextDecoder().decode(decrypted));

  if(!data || !Array.isArray(data.memos)){
    throw new Error("旧メモデータの形式が違います");
  }

  return data;
}

/* 旧バージョンのIndexedDBから解除キーを取得 */
function getOldSessionKey(){
  return new Promise((resolve,reject) => {
    const request = indexedDB.open("otolis-mymemo-session",1);

    request.onupgradeneeded = () => {
      request.transaction.abort();
      resolve(null);
    };

    request.onsuccess = () => {
      const db = request.result;

      if(!db.objectStoreNames.contains("sessions")){
        db.close();
        resolve(null);
        return;
      }

      const tx = db.transaction("sessions","readonly");
      const get = tx.objectStore("sessions").get("active");

      get.onsuccess = () => {
        const session = get.result;
        db.close();
        resolve(session && session.key ? session.key : null);
      };

      get.onerror = () => {
        db.close();
        reject(get.error);
      };
    };

    request.onerror = () => reject(request.error);
  });
}

/* 旧データの自動移行 */
async function migrateOldData(){
  /*
    1. 旧バージョンの通常データがあれば移行
  */
  const oldPlain = localStorage.getItem(OLD_STORAGE_KEY);

  if(oldPlain){
    try{
      const data = JSON.parse(oldPlain);
      if(data && Array.isArray(data.memos)){
        normalizeData(data);
        saveData();
        return true;
      }
    }catch(error){
      console.error("旧通常データの移行に失敗",error);
    }
  }

  /*
    2. 旧暗号化データがあれば、端末内に保存済みの
       暗号鍵を使って自動復号を試みる
  */
  const oldEncrypted = localStorage.getItem(OLD_ENCRYPTED_KEY);

  if(oldEncrypted){
    try{
      const record = JSON.parse(oldEncrypted);
      const key = await getOldSessionKey();

      if(!key){
        throw new Error("旧データの解除キーが見つかりません");
      }

      const data = await decryptOldVault(record,key);
      normalizeData(data);
      saveData();

      return true;
    }catch(error){
      console.error("旧暗号化データの移行に失敗",error);
      throw new Error(
        "以前の暗号化メモを自動で開けなかったよ。旧データは消さずに残してあるよ。"
      );
    }
  }

  return false;
}

/* バックアップ用ファイル名の日付 */
function getFileDate(){
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth()+1).padStart(2,"0");
  const day = String(now.getDate()).padStart(2,"0");
  return `${year}${month}${day}`;
}

/* JSONダウンロード */
function downloadJSON(data,filename){
  const blob = new Blob([JSON.stringify(data,null,2)],{
    type:"application/json"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url),1000);
}

/* バックアップ */
function backupData(){
  try{
    saveData();

    const backup = {
      app:"オトリス・メモル",
      backupVersion:1,
      exportedAt:new Date().toISOString(),
      memos,
      tags:allTags
    };

    downloadJSON(
      backup,
      "メモル_"+getFileDate()+".json"
    );

    alert("バックアップを作成したよ！");
  }catch(error){
    console.error(error);
    alert("バックアップを作成できなかったよ。");
  }
}

/* バックアップ復元 */
async function restoreData(file){
  if(!file) return;

  try{
    const text = await file.text();
    const backup = JSON.parse(text);

    let data;

    if(Array.isArray(backup.memos)){
      data = backup;
    }else if(backup.data && Array.isArray(backup.data.memos)){
      data = backup.data;
    }else{
      throw new Error("バックアップ形式が違います");
    }

    if(!confirm("現在のメモをバックアップデータで置き換えるよ。よろしい？")){
      return;
    }

    normalizeData(data);
    saveData();

    selectedTags = [];
    selectedMemoIds = [];
    selectionMode = false;
    resetForm();
    renderAll();
    showList();

    alert("バックアップから復元したよ！");
  }catch(error){
    console.error(error);
    alert("復元できなかったよ。バックアップファイルを確認してね。");
  }
}

/* 画面切り替え */
function showList(){
  $("editor").hidden = true;
  $("detailView").hidden = true;
  $("listScreen").hidden = false;
  viewingId = null;
  editingId = null;
  window.scrollTo({top:0,behavior:"smooth"});
}

function showEditor(){
  $("listScreen").hidden = true;
  $("detailView").hidden = true;
  $("editor").hidden = false;
  window.scrollTo({top:0,behavior:"smooth"});
}

function showDetail(id){
  const memo = memos.find(m => m.id === id);
  if(!memo) return;

  viewingId = id;
  $("listScreen").hidden = true;
  $("editor").hidden = true;
  $("detailView").hidden = false;

  $("viewTitle").textContent = memo.title || "タイトルなし";
  $("viewBody").textContent = memo.body;
  $("viewTags").innerHTML = memo.tags.map(tag =>
    `<span class="tag">${escapeHTML(tag)}</span>`
  ).join("");

    `追加：${formatDate(memo.createdAt)}　／　更新：${formatDate(memo.updatedAt)}`;

  window.scrollTo({top:0,behavior:"smooth"});
}

/* 本文コピー */
function copyTextFallback(text){
  const textarea = document.createElement("textarea");
  textarea.value = text;
  textarea.setAttribute("readonly","");
  textarea.style.position = "fixed";
  textarea.style.left = "-9999px";
  textarea.style.top = "0";
  document.body.appendChild(textarea);

  textarea.focus();
  textarea.select();
  textarea.setSelectionRange(0,textarea.value.length);

  let success = false;
  try{
    success = document.execCommand("copy");
  }catch(error){
    success = false;
  }

  textarea.remove();
  return success;
}

async function copyMemoBody(){
  const memo = memos.find(m => m.id === viewingId);
  if(!memo) return;

  if(!memo.body){
    alert("コピーする本文がないよ。");
    return;
  }

  try{
    let copied = false;

    if(navigator.clipboard && window.isSecureContext){
      try{
        await navigator.clipboard.writeText(memo.body);
        copied = true;
      }catch(error){
        copied = copyTextFallback(memo.body);
      }
    }else{
      copied = copyTextFallback(memo.body);
    }

    if(!copied) throw new Error("コピーに失敗しました");

    alert("本文をコピーしたよ！");
  }catch(error){
    console.error(error);
    alert("コピーできなかったよ。本文を長押ししてコピーしてね。");
  }
}

/* タグ選択 */
function renderDraftTags(){
  $("memoTagPicker").innerHTML = allTags.length
    ? allTags.map(tag => `
      <button type="button"
        class="tag-choice ${draftTags.includes(tag) ? "active" : ""}"
        data-draft-tag="${escapeHTML(tag)}">
        ${draftTags.includes(tag) ? "✓ " : ""}${escapeHTML(tag)}
      </button>
    `).join("")
    : '<span class="note">まだタグはありません。下から新しく追加できるよ。</span>';
}

function toggleDraftTag(tag){
  draftTags = draftTags.includes(tag)
    ? draftTags.filter(t => t !== tag)
    : [...draftTags,tag];
  renderDraftTags();
}

function addDraftTag(){
  const tag = $("memoTagInput").value.trim();
  if(!tag) return;

  if(!allTags.includes(tag)) allTags.push(tag);
  if(!draftTags.includes(tag)) draftTags.push(tag);

  $("memoTagInput").value = "";

  try{
    saveData();
    renderDraftTags();
    renderAll();
  }catch(error){
    alert("保存できなかったよ。");
  }
}

function resetForm(){
  editingId = null;
  draftTags = [];
  $("memoTitle").value = "";
  $("memoBody").value = "";
  $("memoTagInput").value = "";
  $("formHeading").textContent = "＋ メモを追加";
  $("saveMemo").textContent = "保存する";
  renderDraftTags();
}

function startNewMemo(){
  resetForm();
  showEditor();
}

function startEditMemo(id){
  const memo = memos.find(m => m.id === id);
  if(!memo) return;

  editingId = id;
  draftTags = [...memo.tags];
  $("memoTitle").value = memo.title;
  $("memoBody").value = memo.body;
  $("formHeading").textContent = "メモを編集";
  $("saveMemo").textContent = "変更を保存";

  renderDraftTags();
  showEditor();
}

/* メモ保存 */
function saveMemo(){
  const title = $("memoTitle").value.trim();
  const body = $("memoBody").value.trim();

  if(!body){
    alert("本文を入力してね。");
    $("memoBody").focus();
    return;
  }

  const now = Date.now();
  let savedId;
  const wasEditing = !!editingId;

  if(editingId){
    const memo = memos.find(m => m.id === editingId);
    if(!memo) return;

    memo.title = title;
    memo.body = body;
    memo.tags = [...draftTags];
    memo.updatedAt = now;
    savedId = memo.id;
  }else{
    savedId = makeId();
    memos.unshift({
      id:savedId,
      title,
      body,
      tags:[...draftTags],
      createdAt:now,
      updatedAt:now
    });
  }

  syncAllTags();

  try{
    saveData();
    resetForm();
    renderAll();

    if(wasEditing) showDetail(savedId);
    else showList();
  }catch(error){
    alert("保存できなかったよ。もう一度試してね。");
  }
}

/* メモ削除 */
function deleteMemo(id){
  if(!confirm("このメモを削除する？")) return;

  memos = memos.filter(m => m.id !== id);
  selectedMemoIds = selectedMemoIds.filter(x => x !== id);
  syncAllTags();

  try{
    saveData();
    resetForm();
    renderAll();
    showList();
  }catch(error){
    alert("削除を保存できなかったよ。");
  }
}

/* 検索・並べ替え */
function getFilteredMemos(){
  const keyword = $("keyword").value.trim().toLowerCase();
  const mode = document.querySelector('input[name="tagMode"]:checked').value;

  const filtered = memos.filter(memo => {
    const text = (
      memo.title+"\n"+memo.body+"\n"+memo.tags.join(" ")
    ).toLowerCase();

    const matchesKeyword = !keyword || text.includes(keyword);

    const matchesTags = selectedTags.length === 0 ||
      (mode === "and"
        ? selectedTags.every(tag => memo.tags.includes(tag))
        : selectedTags.some(tag => memo.tags.includes(tag)));

    return matchesKeyword && matchesTags;
  });

  const sortKey = $("sortKey").value;
  const direction = $("sortOrder").value === "asc" ? 1 : -1;

  filtered.sort((a,b) => {
    let result = 0;

    if(sortKey === "title"){
      result = (a.title || "タイトルなし").localeCompare(
        b.title || "タイトルなし","ja",
        {numeric:true,sensitivity:"base"}
      );
    }else{
      result = Number(a[sortKey] || 0)-Number(b[sortKey] || 0);
    }

    if(result === 0){
      result = Number(a.createdAt || 0)-Number(b.createdAt || 0);
    }

    return result*direction;
  });

  return filtered;
}

/* タグ表示 */
function renderFilterTags(){
  $("filterTagList").innerHTML = allTags.map(tag => `
    <button type="button"
      class="filter-tag ${selectedTags.includes(tag) ? "active" : ""}"
      data-filter-tag="${escapeHTML(tag)}">${escapeHTML(tag)}</button>
  `).join("");
}

function renderManageTags(){
  $("manageTagList").innerHTML = allTags.length
    ? allTags.map(tag => `
      <span class="tag">${escapeHTML(tag)}
        <button type="button" data-rename-tag="${escapeHTML(tag)}">✎</button>
        <button type="button" data-delete-tag="${escapeHTML(tag)}">×</button>
      </span>
    `).join("")
    : '<span class="note">まだタグはありません。</span>';
}

function renderBulkTagOptions(){
  const add = $("bulkAddTag");
  const remove = $("bulkRemoveTag");
  const addValue = add.value;
  const removeValue = remove.value;

  add.innerHTML = '<option value="">追加するタグを選択</option>' +
    allTags.map(tag =>
      `<option value="${escapeHTML(tag)}">${escapeHTML(tag)}</option>`
    ).join("");

  remove.innerHTML = '<option value="">外すタグを選択</option>' +
    allTags.map(tag =>
      `<option value="${escapeHTML(tag)}">${escapeHTML(tag)}</option>`
    ).join("");

  if(allTags.includes(addValue)) add.value = addValue;
  if(allTags.includes(removeValue)) remove.value = removeValue;
}

/* 複数選択表示 */
function renderSelectionTools(){
  const count = selectedMemoIds.length;

  $("toggleSelectBtn").textContent =
    selectionMode ? "選択を終了" : "複数選択";

  $("selectedCount").hidden = !selectionMode;
  $("selectedCount").textContent = `${count}件選択中`;
  $("selectAllBtn").hidden = !selectionMode;
  $("clearSelectionBtn").hidden = !selectionMode;
  $("bulkPanel").hidden = !selectionMode;

  $("bulkAddBtn").disabled = count === 0;
  $("bulkNewTagBtn").disabled = count === 0;
  $("bulkRemoveBtn").disabled = count === 0;
}

/* メモ一覧 */
function renderMemos(){
  const filtered = getFilteredMemos();
  $("memoCount").textContent = `${filtered.length} / ${memos.length} 件`;

  if(filtered.length === 0){
    $("memoList").innerHTML =
      '<div class="table-empty">メモが見つからなかったよ。</div>';

    renderSelectionTools();
    return;
  }

  const rows = filtered.map(memo => {
    const tags = memo.tags.slice(0,3).map(tag =>
      `<span class="tag">${escapeHTML(tag)}</span>`
    ).join("");

    const extra = memo.tags.length > 3
      ? `<span class="tag">+${memo.tags.length-3}</span>`
      : "";

    return `
      <tr>
        <td class="check-col">
          ${selectionMode ? `
            <input type="checkbox" data-select-id="${escapeHTML(memo.id)}"
              ${selectedMemoIds.includes(memo.id) ? "checked" : ""}
              aria-label="このメモを選択">
          ` : ""}
        </td>
        <td class="title-col" data-open-id="${escapeHTML(memo.id)}">
          ${escapeHTML(memo.title || "タイトルなし")}
        </td>
        <td class="body-col" data-open-id="${escapeHTML(memo.id)}">
          ${escapeHTML(memo.body.replace(/\s+/g," "))}
        </td>
        <td class="date-col">${formatDate(memo.createdAt)}</td>
        <td class="date-col">${formatDate(memo.updatedAt)}</td>
        <td class="tags-col"><div class="row-tags">${tags}${extra}</div></td>
      </tr>
    `;
  }).join("");

  $("memoList").innerHTML = `
    <table class="memo-table">
      <thead><tr>
        <th class="check-col"></th>
        <th class="title-col">タイトル</th>
        <th class="body-col">本文</th>
        <th class="date-col">作成日時</th>
        <th class="date-col">更新日時</th>
        <th class="tags-col">タグ</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  renderSelectionTools();
}

function renderAll(){
  renderFilterTags();
  renderManageTags();
  renderBulkTagOptions();
  renderMemos();
}

/* 複数選択 */
function toggleSelectionMode(){
  selectionMode = !selectionMode;
  selectedMemoIds = [];
  renderMemos();
}

function toggleMemoSelection(id){
  selectedMemoIds = selectedMemoIds.includes(id)
    ? selectedMemoIds.filter(x => x !== id)
    : [...selectedMemoIds,id];

  renderMemos();
}

function selectAllFiltered(){
  selectedMemoIds = getFilteredMemos().map(m => m.id);
  renderMemos();
}

function clearSelection(){
  selectedMemoIds = [];
  renderMemos();
}

/* タグ一括追加 */
function bulkAddTag(tag){
  if(!tag || selectedMemoIds.length === 0) return;

  selectedMemoIds.forEach(id => {
    const memo = memos.find(m => m.id === id);
    if(memo && !memo.tags.includes(tag)) memo.tags.push(tag);
  });

  syncAllTags();

  try{
    saveData();
    renderAll();
    alert(`選択したメモに「${tag}」を追加したよ。`);
  }catch(error){
    alert("保存できなかったよ。");
  }
}

/* タグ一括解除 */
function bulkRemoveTag(tag){
  if(!tag || selectedMemoIds.length === 0) return;

  selectedMemoIds.forEach(id => {
    const memo = memos.find(m => m.id === id);
    if(memo) memo.tags = memo.tags.filter(t => t !== tag);
  });

  try{
    saveData();
    renderAll();
    alert(`選択したメモから「${tag}」を外したよ。`);
  }catch(error){
    alert("保存できなかったよ。");
  }
}

/* 新規タグ作成・一括追加 */
function bulkCreateAndAddTag(){
  const tag = $("bulkNewTag").value.trim();
  if(!tag || selectedMemoIds.length === 0) return;

  if(!allTags.includes(tag)) allTags.push(tag);
  $("bulkNewTag").value = "";

  bulkAddTag(tag);
}

/* タグ名変更 */
function renameTag(oldTag){
  const newTag = prompt("新しいタグ名を入力してね。",oldTag);
  if(newTag === null) return;

  const name = newTag.trim();

  if(!name){
    alert("タグ名を空にはできないよ。");
    return;
  }

  if(name !== oldTag && allTags.includes(name)){
    alert("そのタグ名はすでにあるよ。");
    return;
  }

  allTags = allTags.map(tag => tag === oldTag ? name : tag);

  memos.forEach(memo => {
    memo.tags = memo.tags.map(tag => tag === oldTag ? name : tag);
  });

  draftTags = draftTags.map(tag => tag === oldTag ? name : tag);
  selectedTags = selectedTags.map(tag => tag === oldTag ? name : tag);

  try{
    saveData();
    renderAll();
    renderDraftTags();
    if(viewingId) showDetail(viewingId);
  }catch(error){
    alert("保存できなかったよ。");
  }
}

/* タグ削除 */
function deleteTag(tag){
  if(!confirm(`「${tag}」を削除する？\nこのタグはメモからも外れるよ。`)){
    return;
  }

  allTags = allTags.filter(t => t !== tag);
  memos.forEach(memo => {
    memo.tags = memo.tags.filter(t => t !== tag);
  });

  draftTags = draftTags.filter(t => t !== tag);
  selectedTags = selectedTags.filter(t => t !== tag);

  try{
    saveData();
    renderAll();
    renderDraftTags();
    if(viewingId) showDetail(viewingId);
  }catch(error){
    alert("保存できなかったよ。");
  }
}

$("bulkRemoveBtn").addEventListener("click",() => {

});

/* 起動 */
async function initialize(){
  try{
    /*
      新しい保存先にデータがあれば、そのまま読み込む
    */
    if(loadLocalData()){
      renderAll();
      return;
    }

    /*
      新しい保存先が空なら旧データの移行を試みる
    */
    const migrated = await migrateOldData();

    if(migrated){
      renderAll();
      alert("以前のメモを新しい保存方式に移行したよ！");
      return;
    }

    /*
      旧データもない場合は空のメモ帳として起動
    */
    memos = [];
    allTags = [];
    saveData();
    renderAll();

  }catch(error){
    console.error("起動時の読み込みエラー",error);

    /*
      暗号化された旧データを復号できない場合は、
      空データで上書きしないようにする
    */
    $("listScreen").hidden = true;

    const warning = document.createElement("section");
    warning.className = "panel";
    warning.innerHTML = `
      <h2>以前のメモを読み込めなかったよ</h2>
      <p class="note">
        以前の暗号化データは消さずに残してあるよ。
        旧バージョンで一度メモを開いてから、
        バックアップを作成する必要があるよ。
      </p>
      <p class="note">
        新しい保存データで上書きしていないので、
        以前のメモは失われていないよ。
      </p>
    `;

    $("appShell").querySelector("main").prepend(warning);
  }
}

initialize();

/* オフライン対応 */
if("serviceWorker" in navigator){
  window.addEventListener("load",() => {
    navigator.serviceWorker.register("./sw.js").catch(error => {
      console.log("Service Worker登録エラー",error);
    });
  });
}
