
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f6f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<title>マイピア｜おとりす</title>

<style>
:root{
  --bg:#f6f3ee;
  --paper:#fff;
  --ink:#302d29;
  --muted:#969087;
  --line:#e9e3da;
  --pink:#e9b8bd;
  --pink-dark:#bd7884;
  --blue:#a9c7dc;
  --blue-dark:#628ba9;
  --shadow:0 3px 14px rgba(65,52,40,.07);
  --white-key-width:43px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Yu Gothic",Meiryo,sans-serif;
}

body{
  overflow-x:hidden;
}

button{
  font:inherit;
  cursor:pointer;
  border:0;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;
}

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:9px 12px 12px;
}

/* 開閉ボタン */

.menu-handle{
  width:100%;
  height:31px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  background:transparent;
  color:#92897f;
  font-size:10px;
  letter-spacing:.08em;
  border-radius:9px;
  margin-bottom:5px;
}

.handle-line{
  width:34px;
  height:4px;
  border-radius:5px;
  background:#c9c0b5;
}

.handle-arrow{
  font-size:13px;
  transition:transform .25s ease;
}

.menu-handle.open .handle-arrow{
  transform:rotate(180deg);
}

/* 上部メニュー */

.menu-panel{
  display:grid;
  grid-template-rows:0fr;
  opacity:0;
  margin-bottom:0;
  transition:
    grid-template-rows .28s ease,
    opacity .22s ease,
    margin .28s ease;
  pointer-events:none;
}

.menu-panel.open{
  grid-template-rows:1fr;
  opacity:1;
  margin-bottom:9px;
  pointer-events:auto;
}

.menu-inner{
  min-height:0;
  overflow:hidden;
}

.menu-content{
  background:var(--paper);
  border-radius:14px;
  padding:10px;
  box-shadow:var(--shadow);
}

/* コード名・五線譜 */

.chord-display{
  display:flex;
  align-items:center;
  gap:7px;
  min-height:76px;
}

.chord-info{
  width:27%;
  min-width:88px;
  text-align:center;
  flex-shrink:0;
}

.chord-label{
  font-size:8px;
  color:var(--muted);
  letter-spacing:.1em;
}

.chord-name{
  font-size:27px;
  font-weight:750;
  margin:2px 0;
  min-height:33px;
  line-height:1.2;
}

.chord-notes{
  font-size:9px;
  color:#8d857b;
  line-height:1.4;
  min-height:13px;
}

.staff-wrap{
  flex:1;
  min-width:0;
  overflow:hidden;
}

#staff{
  display:block;
  width:100%;
  height:auto;
}

.staff-lines{
  stroke:#827d75;
  stroke-width:1.2;
}

.staff-note{
  fill:#302d29;
}

.staff-stem{
  stroke:#302d29;
  stroke-width:1.5;
}

.staff-accidental{
  font-size:18px;
  fill:#302d29;
  font-family:serif;
}

.staff-clef{
  font-family:serif;
  font-size:75px;
  fill:#665f56;
}

.staff-empty{
  font-size:13px;
  fill:#b1aaa1;
}

/* ベース音 */

.bass-selector{
  border-top:1px solid #eee9e2;
  padding-top:8px;
  margin-top:4px;
}

.bass-selector-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:6px;
}

.bass-selector-title{
  font-size:10px;
  font-weight:700;
  color:#716b63;
}

.bass-selector-hint{
  font-size:9px;
  color:#aaa197;
}

.bass-buttons{
  display:grid;
  grid-template-columns:repeat(12,minmax(0,1fr));
  gap:4px;
}

.bass-btn{
  min-width:0;
  height:30px;
  border-radius:7px;
  background:#f2f5f7;
  color:#647786;
  font-size:11px;
  font-weight:650;
  padding:0;
  border:1px solid transparent;
}

.bass-btn.active{
  background:#c5dceb;
  color:#365b76;
  border-color:var(--blue-dark);
  font-weight:800;
}

.bass-btn:active{
  transform:scale(.96);
}

/* 音の情報 */

.info-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:9px;
}

.info-box{
  background:#faf8f5;
  border-radius:9px;
  padding:7px;
  text-align:center;
}

.info-title{
  font-size:9px;
  color:var(--muted);
  margin-bottom:3px;
}

.info-value{
  font-size:14px;
  font-weight:750;
}

.degree-info{
  margin-top:7px;
  font-size:10px;
  color:#827b72;
  line-height:1.5;
}

.info-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.section-title{
  font-size:11px;
  font-weight:750;
}

.clear-btn{
  background:#f3f0eb;
  color:#70685f;
  border-radius:8px;
  padding:6px 10px;
  font-size:10px;
}

/* 鍵盤 */

.keyboard-card{
  background:var(--paper);
  border-radius:15px;
  padding:10px 10px 9px;
  box-shadow:var(--shadow);
}

.keyboard-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:7px;
}

.keyboard-name{
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:750;
  font-size:11px;
}

.color-dot{
  width:8px;
  height:8px;
  border-radius:50%;
}

.main-dot{
  background:var(--pink);
}

.range-controls{
  display:flex;
  align-items:center;
  gap:6px;
}

.range-btn{
  background:#f3f0eb;
  border-radius:8px;
  width:31px;
  height:28px;
  font-size:17px;
  color:#625c55;
}

.range-text{
  font-size:10px;
  color:var(--muted);
  min-width:65px;
  text-align:center;
}

.keyboard-scroll{
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:thin;
  padding:2px 2px 8px;
  touch-action:pan-x;
  -webkit-overflow-scrolling:touch;
}

.keys{
  position:relative;
  display:block;
  height:clamp(125px,24vh,220px);
  width:max-content;
  padding:0;
  margin:0;
  touch-action:none;
  --white-count:12;
}

.key{
  position:absolute;
  top:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding-bottom:9px;
  border:1px solid #d9d3ca;
  border-radius:0 0 7px 7px;
  color:#5e5851;
  box-shadow:0 3px 2px #0000000b;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

.key.white{
  left:var(--key-left);
  width:calc(100% / var(--white-count));
  height:100%;
  background:#fffefa;
  z-index:1;
}

.key.black{
  left:var(--key-left);
  transform:translateX(-50%);
  width:calc(100% / var(--white-count) * .62);
  height:72%;
  background:#494641;
  color:#fff;
  border:1px solid #35322f;
  border-radius:0 0 6px 6px;
  padding-bottom:7px;
  z-index:3;
  box-shadow:0 3px 4px #00000030;
}

.key.selected.main-selected{
  background:#f1cbd0;
  border-color:var(--pink-dark);
  color:#70454b;
}

.key.black.selected{
  filter:brightness(1.35);
}

.key:active{
  transform:translateY(1px);
}

.key.black:active{
  transform:translateX(-50%) translateY(1px);
}

.key-name{
  font-size:12px;
  font-weight:650;
  pointer-events:none;
}

.key-octave{
  font-size:9px;
  opacity:.65;
  margin-top:2px;
  pointer-events:none;
}

.key-degree{
  position:absolute;
  top:8px;
  left:0;
  right:0;
  text-align:center;
  font-size:10px;
  font-weight:750;
  pointer-events:none;
}

.key.black .key-degree{
  top:7px;
  font-size:9px;
}

.key.black .key-name{
  font-size:10px;
}

.keyboard-hint{
  font-size:9px;
  color:#aaa197;
  margin-top:4px;
  text-align:center;
}

.mode-indicator{
  font-size:9px;
  color:#a69d93;
  text-align:right;
}

/* スマートフォン */

@media(max-width:480px){
  :root{
    --white-key-width:39px;
  }

  .app{
    padding:6px 8px 12px;
  }

  .menu-handle{
    height:27px;
  }

  .menu-content{
    padding:8px;
  }

  .chord-display{
    min-height:69px;
    gap:4px;
  }

  .chord-info{
    width:28%;
    min-width:80px;
  }

  .chord-name{
    font-size:24px;
    min-height:30px;
  }

  .chord-notes{
    font-size:8px;
  }

  .bass-buttons{
    gap:3px;
  }

  .bass-btn{
    height:28px;
    font-size:9px;
  }

  .keyboard-card{
    padding:9px 8px;
  }

  .keys{
    height:clamp(116px,23vh,190px);
  }
}
</style>
</head>

<body>
<div class="app">

<!-- メニュー開閉ボタン -->

<button class="menu-handle" id="menuToggle"
        type="button" aria-expanded="false">
  <span class="handle-line"></span>
  <span id="handleText">メニューを開く</span>
  <span class="handle-arrow">⌄</span>
  <span class="handle-line"></span>
</button>

<!-- 開閉式メニュー -->

<div class="menu-panel" id="menuPanel">
<div class="menu-inner">
<div class="menu-content">

  <div class="chord-display">

    <div class="chord-info">
      <div class="chord-label">CHORD NAME</div>
      <div class="chord-name" id="chordName">---</div>
      <div class="chord-notes" id="chordNotes">音を選択してね</div>
    </div>

    <div class="staff-wrap">
      <svg id="staff" viewBox="0 0 700 190"
           xmlns="http://www.w3.org/2000/svg">
        <g class="staff-lines">
          <line x1="65" y1="60" x2="675" y2="60"/>
          <line x1="65" y1="80" x2="675" y2="80"/>
          <line x1="65" y1="100" x2="675" y2="100"/>
          <line x1="65" y1="120" x2="675" y2="120"/>
          <line x1="65" y1="140" x2="675" y2="140"/>
        </g>
        <text x="72" y="130" class="staff-clef">𝄞</text>
        <g id="staffNotes"></g>
      </svg>
    </div>

  </div>

  <div class="bass-selector">
    <div class="bass-selector-head">
      <div class="bass-selector-title">BASS / ベース音</div>
      <div class="bass-selector-hint">コードの基準音を選択</div>
    </div>

    <div class="bass-buttons" id="bassButtons">
      <button class="bass-btn" data-note="0">C</button>
      <button class="bass-btn" data-note="1">C♯</button>
      <button class="bass-btn" data-note="2">D</button>
      <button class="bass-btn" data-note="3">D♯</button>
      <button class="bass-btn" data-note="4">E</button>
      <button class="bass-btn" data-note="5">F</button>
      <button class="bass-btn" data-note="6">F♯</button>
      <button class="bass-btn" data-note="7">G</button>
      <button class="bass-btn" data-note="8">G♯</button>
      <button class="bass-btn" data-note="9">A</button>
      <button class="bass-btn" data-note="10">A♯</button>
      <button class="bass-btn" data-note="11">B</button>
    </div>
  </div>

  <div class="info-row">
    <div class="info-box">
      <div class="info-title">ベース音 / ROOT</div>
      <div class="info-value" id="bassInfo">---</div>
    </div>

    <div class="info-box">
      <div class="info-title">選択した音</div>
      <div class="info-value" id="selectedCount">0音</div>
    </div>
  </div>

  <div class="degree-info" id="degreeInfo">
    ベース音を選ぶと、メイン鍵盤に度数が表示されるよ。
  </div>

  <div class="info-heading" style="margin-top:8px">
    <div class="section-title">コード選択</div>
    <button class="clear-btn" id="clearAll">選択をクリア</button>
  </div>

</div>
</div>
</div>

<!-- メイン鍵盤 -->

<section class="keyboard-card">

  <div class="keyboard-heading">
    <div class="keyboard-name">
      <span class="color-dot main-dot"></span>
      メイン鍵盤
    </div>

    <div class="range-controls">
      <button class="range-btn" id="mainLeft">‹</button>
      <span class="range-text" id="mainRange"></span>
      <button class="range-btn" id="mainRight">›</button>
    </div>
  </div>

  <div class="keyboard-scroll" id="mainScroll">
    <div class="keys" id="mainKeys"></div>
  </div>

  <div class="keyboard-hint" id="keyboardHint">
    鍵盤を押して演奏
  </div>

  <div class="mode-indicator" id="modeIndicator">
    PLAY MODE
  </div>

</section>

</div>

<script>
/* =====================================
   基本設定
===================================== */

const NOTE_NAMES=[
  "C","C♯","D","D♯","E","F",
  "F♯","G","G♯","A","A♯","B"
];

const BLACK=[1,3,6,8,10];

let mainStart=60;
let mainSelected=new Set();
let bassSelected=null;
let mode="play";
let menuOpen=false;

let audioContext=null;

/*
  音の管理

  main:60  = メイン鍵盤のC4
  bass:0   = ベース音のC3

  メイン鍵盤とベース音を別々に管理することで、
  同じ音程になっても互いに停止しないようにする。
*/

let activeVoices=new Map();

/* =====================================
   音声処理
===================================== */

function getAudio(){
  if(!audioContext){
    const AudioContextClass=
      window.AudioContext||window.webkitAudioContext;

    if(!AudioContextClass)return null;

    audioContext=new AudioContextClass();
  }

  if(audioContext.state==="suspended"){
    audioContext.resume().catch(error=>{
      console.log(error);
    });
  }

  return audioContext;
}

function frequency(midi){
  return 440*Math.pow(2,(midi-69)/12);
}

/*
  音を鳴らす

  voiceId：音を区別するためのID
  midi：実際に鳴らす音程
*/

function startSound(voiceId,midi){
  const ctx=getAudio();
  if(!ctx)return;

  stopSound(voiceId);

  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  const volume=ctx.createGain();

  osc.type="triangle";
  osc.frequency.value=frequency(midi);

  volume.gain.value=.32;

  gain.gain.setValueAtTime(.0001,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    .16,ctx.currentTime+.025
  );

  osc.connect(gain);
  gain.connect(volume);
  volume.connect(ctx.destination);

  osc.start();

  activeVoices.set(voiceId,{osc,gain});
}

/*
  指定した音だけ止める
*/

function stopSound(voiceId){
  const voice=activeVoices.get(voiceId);
  if(!voice)return;

  const ctx=getAudio();
  if(!ctx)return;

  const now=ctx.currentTime;

  voice.gain.gain.cancelScheduledValues(now);
  voice.gain.gain.setTargetAtTime(.0001,now,.04);

  try{
    voice.osc.stop(now+.2);
  }catch(error){}

  activeVoices.delete(voiceId);
}

/*
  すべての音を止める
*/

function stopAllSounds(){
  [...activeVoices.keys()].forEach(stopSound);
}

/* =====================================
   音名処理
===================================== */

function pitchClass(midi){
  return ((midi%12)+12)%12;
}

function octave(midi){
  return Math.floor(midi/12)-1;
}

function noteName(midi){
  return NOTE_NAMES[pitchClass(midi)]+octave(midi);
}

function shortNote(midi){
  return NOTE_NAMES[pitchClass(midi)];
}

function isBlack(midi){
  return BLACK.includes(pitchClass(midi));
}

/* =====================================
   度数表示
===================================== */

function degreeName(semitones){
  const degrees={
    0:"1",
    1:"♭2",
    2:"2",
    3:"♭3",
    4:"3",
    5:"4",
    6:"♭5",
    7:"5",
    8:"♯5",
    9:"6",
    10:"♭7",
    11:"7"
  };

  return degrees[((semitones%12)+12)%12];
}

function degreeFor(midi){
  if(bassSelected===null)return "";

  return degreeName(
    pitchClass(midi)-bassSelected
  );
}

/* =====================================
   コード判定
===================================== */

const CHORDS=[
  ["m7(♭5)",[0,3,6,10]],
  ["dim7",[0,3,6,9]],
  ["mM7",[0,3,7,11]],
  ["M7(♯5)",[0,4,8,11]],
  ["7(♯5)",[0,4,8,10]],
  ["7(♭5)",[0,4,6,10]],
  ["7sus4",[0,5,7,10]],
  ["m7(♭9)",[0,3,7,10,1]],
  ["7(♭9)",[0,4,7,10,1]],
  ["7(♯9)",[0,4,7,10,3]],
  ["7(♯11)",[0,4,7,10,6]],
  ["7(♭13)",[0,4,7,10,8]],
  ["m13",[0,3,7,10,2,9]],
  ["13",[0,4,7,10,2,9]],
  ["M13",[0,4,7,11,2,9]],
  ["m11",[0,3,7,10,2,5]],
  ["11",[0,4,7,10,2,5]],
  ["M11",[0,4,7,11,2,5]],
  ["m9",[0,3,7,10,2]],
  ["M9",[0,4,7,11,2]],
  ["9",[0,4,7,10,2]],
  ["m7",[0,3,7,10]],
  ["M7",[0,4,7,11]],
  ["7",[0,4,7,10]],
  ["m6",[0,3,7,9]],
  ["6",[0,4,7,9]],
  ["sus2",[0,2,7]],
  ["sus4",[0,5,7]],
  ["aug",[0,4,8]],
  ["dim",[0,3,6]],
  ["m",[0,3,7]],
  ["",[0,4,7]],
  ["(♭5)",[0,4,6]],
  ["(♯5)",[0,4,8]]
];

function detectChord(){
  if(bassSelected===null||mainSelected.size===0){
    return "---";
  }

  const root=bassSelected;
  const intervals=new Set([0]);

  for(const midi of mainSelected){
    intervals.add(
      (pitchClass(midi)-root+12)%12
    );
  }

  let best=null;
  let bestScore=Infinity;

  for(const chord of CHORDS){
    const name=chord[0];
    const required=chord[1];

    let missing=0;
    let extra=0;

    for(const interval of required){
      if(!intervals.has(interval))missing++;
    }

    for(const interval of intervals){
      if(!required.includes(interval))extra++;
    }

    const score=
      missing*2.2+extra*10-required.length*.025;

    if(score<bestScore){
      bestScore=score;
      best=name;
    }
  }

  if(best===null)return "---";

  return NOTE_NAMES[root]+best;
}

/* =====================================
   メニュー開閉
===================================== */

function setMenu(open){
  menuOpen=open;

  const panel=document.getElementById("menuPanel");
  const toggle=document.getElementById("menuToggle");
  const handleText=document.getElementById("handleText");

  panel.classList.toggle("open",open);
  toggle.classList.toggle("open",open);
  toggle.setAttribute("aria-expanded",String(open));

  handleText.textContent=
    open?"メニューを閉じる":"メニューを開く";

  if(open){
    mode="select";
  }else{
    mode="play";

    // メイン鍵盤の選択を解除
    mainSelected.clear();

    // 選択中のベース音も解除
    bassSelected=null;

    // メイン・ベースを含むすべての音を停止
    stopAllSounds();
  }

  renderAll();
}

document.getElementById("menuToggle").onclick=()=>{
  setMenu(!menuOpen);
};

/* =====================================
   ベース音選択
===================================== */

function renderBassButtons(){
  document.querySelectorAll(".bass-btn").forEach(button=>{
    const note=Number(button.dataset.note);

    button.classList.toggle(
      "active",
      bassSelected===note
    );
  });
}

document.querySelectorAll(".bass-btn").forEach(button=>{
  button.addEventListener("click",()=>{
    const note=Number(button.dataset.note);

    const previousBass=bassSelected;

    if(bassSelected===note){

      // 同じベース音をもう一度押したら解除
      bassSelected=null;
      stopSound("bass");

    }else{

      // 前のベース音を停止
      stopSound("bass");

      // 新しいベース音を選択
      bassSelected=note;

      // C3～B3の音域で鳴らし続ける
      const bassMidi=48+note;

      startSound("bass",bassMidi);
    }

    renderAll();
  });
});

/* =====================================
   鍵盤作成
===================================== */

function createKey(midi,whiteIndex){
  const key=document.createElement("button");
  key.type="button";

  const black=isBlack(midi);

  key.className="key "+(black?"black":"white");

  if(mainSelected.has(midi)){
    key.classList.add("selected","main-selected");
  }

  // 音名
  const name=document.createElement("span");
  name.className="key-name";
  name.textContent=shortNote(midi);

  // オクターブ数字
  const oct=document.createElement("span");
  oct.className="key-octave";
  oct.textContent=octave(midi);

  key.appendChild(name);
  key.appendChild(oct);

  // 度数表示
  if(bassSelected!==null){
    const degree=document.createElement("span");
    degree.className="key-degree";
    degree.textContent=degreeFor(midi);
    key.appendChild(degree);
  }

  if(black){
    key.style.setProperty(
      "--key-left",
      `calc(${whiteIndex+1} * 100% / var(--white-count))`
    );
  }else{
    key.style.setProperty(
      "--key-left",
      `calc(${whiteIndex} * 100% / var(--white-count))`
    );
  }

  let pointerDown=false;

  key.addEventListener("pointerdown",e=>{
    e.preventDefault();

    if(mode==="select"){

      const voiceId="main:"+midi;

      if(mainSelected.has(midi)){

        // 選択解除した音だけ停止
        mainSelected.delete(midi);
        stopSound(voiceId);

      }else{

        // 選択した音を追加して鳴らし続ける
        mainSelected.add(midi);
        startSound(voiceId,midi);
      }

      renderAll();

    }else{

      // 通常モードは押している間だけ鳴らす
      pointerDown=true;

      getAudio();
      startSound("main:"+midi,midi);

      try{
        key.setPointerCapture(e.pointerId);
      }catch(error){}
    }
  });

  const release=()=>{
    if(pointerDown){
      pointerDown=false;
      stopSound("main:"+midi);
    }
  };

  key.addEventListener("pointerup",release);
  key.addEventListener("pointerleave",release);
  key.addEventListener("pointercancel",release);
  key.addEventListener("lostpointercapture",release);

  return key;
}

/* =====================================
   鍵盤描画
===================================== */

function renderOneKeyboard(containerId,start,count){
  const container=document.getElementById(containerId);
  container.innerHTML="";

  const whiteNotes=[];
  const blackNotes=[];

  let whiteIndex=0;

  for(let i=0;i<count;i++){
    const midi=start+i;

    if(isBlack(midi)){
      blackNotes.push({
        midi,
        whiteIndex:whiteIndex-1
      });
    }else{
      whiteNotes.push({
        midi,
        whiteIndex:whiteIndex
      });

      whiteIndex++;
    }
  }

  container.style.setProperty(
    "--white-count",
    whiteNotes.length
  );

  container.style.width=
    `calc(${whiteNotes.length} * var(--white-key-width))`;

  whiteNotes.forEach(item=>{
    container.appendChild(
      createKey(item.midi,item.whiteIndex)
    );
  });

  blackNotes.forEach(item=>{
    container.appendChild(
      createKey(item.midi,item.whiteIndex)
    );
  });
}

function renderKeyboard(){
  renderOneKeyboard("mainKeys",mainStart,19);

  document.getElementById("mainRange").textContent=
    noteName(mainStart)+" ～ "+noteName(mainStart+18);
}

/* =====================================
   五線譜
===================================== */

const STAFF_LETTERS=["C","D","E","F","G","A","B"];

function staffPosition(letter,oct){
  const index=STAFF_LETTERS.indexOf(letter);
  const absolute=oct*7+index;
  const base=4*7+2;

  return 140-(absolute-base)*10;
}

function staffSpelling(pc){
  const spellings={
    0:["C",""],
    1:["C","♯"],
    2:["D",""],
    3:["D","♯"],
    4:["E",""],
    5:["F",""],
    6:["F","♯"],
    7:["G",""],
    8:["G","♯"],
    9:["A",""],
    10:["A","♯"],
    11:["B",""]
  };

  return spellings[pc];
}

function renderStaff(){
  const group=document.getElementById("staffNotes");
  group.innerHTML="";

  const noteSet=new Set(
    [...mainSelected].map(m=>pitchClass(m))
  );

  if(bassSelected!==null){
    noteSet.add(bassSelected);
  }

  const pcs=[...noteSet].sort((a,b)=>a-b);

  if(pcs.length===0){
    const empty=document.createElementNS(
      "http://www.w3.org/2000/svg","text"
    );

    empty.setAttribute("x","390");
    empty.setAttribute("y","108");
    empty.setAttribute("text-anchor","middle");
    empty.setAttribute("class","staff-empty");
    empty.textContent="音を選択すると表示";

    group.appendChild(empty);
    return;
  }

  const startX=330;
  const gap=Math.min(
    65,
    300/Math.max(1,pcs.length-1)
  );

  pcs.forEach((pc,index)=>{
    const [letter,accidental]=staffSpelling(pc);

    const oct=4;
    const y=staffPosition(letter,oct);

    const x=
      startX+(index-(pcs.length-1)/2)*gap;

    const note=document.createElementNS(
      "http://www.w3.org/2000/svg","ellipse"
    );

    note.setAttribute("cx",x);
    note.setAttribute("cy",y);
    note.setAttribute("rx","8");
    note.setAttribute("ry","5.5");
    note.setAttribute(
      "transform",
      `rotate(-20 ${x} ${y})`
    );
    note.setAttribute("class","staff-note");

    group.appendChild(note);

    if(y>65){
      const stem=document.createElementNS(
        "http://www.w3.org/2000/svg","line"
      );

      stem.setAttribute("x1",x+7);
      stem.setAttribute("x2",x+7);
      stem.setAttribute("y1",y);
      stem.setAttribute("y2",y-38);
      stem.setAttribute("class","staff-stem");

      group.appendChild(stem);
    }

    if(accidental){
      const acc=document.createElementNS(
        "http://www.w3.org/2000/svg","text"
      );

      acc.setAttribute("x",x-21);
      acc.setAttribute("y",y+6);
      acc.setAttribute("class","staff-accidental");
      acc.textContent=accidental;

      group.appendChild(acc);
    }

    if(y>=150){
      for(let lineY=160;lineY<=y;lineY+=20){
        const line=document.createElementNS(
          "http://www.w3.org/2000/svg","line"
        );

        line.setAttribute("x1",x-12);
        line.setAttribute("x2",x+12);
        line.setAttribute("y1",lineY);
        line.setAttribute("y2",lineY);
        line.setAttribute("class","staff-lines");

        group.appendChild(line);
      }
    }
  });
}

/* =====================================
   情報表示
===================================== */

function renderInfo(){
  const chord=detectChord();

  document.getElementById("chordName").textContent=chord;

  const selectedNotes=[...mainSelected]
    .sort((a,b)=>a-b)
    .map(m=>shortNote(m));

  document.getElementById("chordNotes").textContent=
    selectedNotes.length
    ?"選択音："+selectedNotes.join("・")
    :"メイン音を選択";

  document.getElementById("bassInfo").textContent=
    bassSelected===null
    ?"---"
    :NOTE_NAMES[bassSelected];

  document.getElementById("selectedCount").textContent=
    mainSelected.size+"音";

  if(bassSelected===null){
    document.getElementById("degreeInfo").textContent=
      "ベース音を選ぶと、メイン鍵盤に度数が表示されるよ。";
  }else{
    const degrees=[...mainSelected]
      .sort((a,b)=>a-b)
      .map(m=>shortNote(m)+" = "+degreeFor(m));

    document.getElementById("degreeInfo").textContent=
      "ベース音 "+NOTE_NAMES[bassSelected]+
      " を 1 とした度数："+ 
      (degrees.length
        ?degrees.join(" ／ ")
        :"メイン鍵盤の音を選択してね");
  }
}

/* =====================================
   モード表示
===================================== */

function renderMode(){
  document.getElementById("keyboardHint").textContent=
    mode==="play"
    ?"鍵盤を押して演奏"
    :"タップして音を選択・コードを認識";

  document.getElementById("modeIndicator").textContent=
    mode==="play"
    ?"PLAY MODE"
    :"CHORD SELECT MODE";
}

/* =====================================
   全体更新
===================================== */

function renderAll(){
  renderKeyboard();
  renderBassButtons();
  renderInfo();
  renderStaff();
  renderMode();
}

/* =====================================
   音域移動
===================================== */

document.getElementById("mainLeft").onclick=()=>{
  mainStart-=12;
  renderAll();
};

document.getElementById("mainRight").onclick=()=>{
  mainStart+=12;
  renderAll();
};

/* =====================================
   選択クリア
===================================== */

document.getElementById("clearAll").onclick=()=>{

  // 選択中の音をすべて解除
  mainSelected.clear();
  bassSelected=null;

  // 鳴っている音もすべて停止
  stopAllSounds();

  renderAll();
};
