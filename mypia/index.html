
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f6f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./mypiaicon.png">
<link rel="apple-touch-icon" href="./mypiaicon.png">

<title>マイピア｜おとりす</title>

<style>
:root{
  --bg:#f6f3ee;
  --paper:#fff;
  --ink:#302d29;
  --muted:#969087;
  --line:#e9e3da;
  --pink:#e9b8bd;
  --pink-dark:#bd7884;
  --blue:#a9c7dc;
  --blue-dark:#628ba9;
  --shadow:0 3px 14px rgba(65,52,40,.07);
  --white-key-width:55px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Yu Gothic",Meiryo,sans-serif;
}

button{
  font:inherit;
  cursor:pointer;
  border:0;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;
}

.app{
  width:100%;
  max-width:1100px;
  height:100vh;
  height:100dvh;
  margin:auto;
  padding:7px 12px 3px;
  display:flex;
  flex-direction:column;
  gap:6px;
  overflow:hidden;
}

/* 上部コントロールパネル */

.control-panel{
  flex:0 0 23%;
  min-height:145px;
  max-height:225px;
  background:var(--paper);
  border-radius:14px;
  padding:9px 10px 7px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:5px;
  min-width:0;
}

.control-main{
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(90px,.8fr) minmax(90px,.8fr);
  gap:9px;
  align-items:center;
  min-height:0;
  flex:1;
}

/* ベース音ボタン */

.bass-area{
  min-width:0;
}

.bass-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:4px;
  margin-bottom:6px;
}

.bass-title{
  font-size:10px;
  font-weight:750;
  color:#716b63;
  letter-spacing:.04em;
}

.bass-hint{
  font-size:8px;
  color:#aaa197;
}

.bass-buttons{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-rows:repeat(3,1fr);
  gap:4px;
}

.bass-btn{
  min-width:0;
  height:clamp(27px,3.6vh,36px);
  border-radius:6px;
  background:#f2f5f7;
  color:#647786;
  font-size:12px;
  font-weight:700;
  padding:0;
  border:1px solid transparent;
  transition:background .12s ease;
}

.bass-btn.active{
  background:#c5dceb;
  color:#365b76;
  border-color:var(--blue-dark);
  font-weight:800;
}

.bass-btn:active{
  transform:scale(.96);
}

/* 上部のコード用五線譜 */

.staff-area{
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  border-left:1px solid #eee9e2;
  border-right:1px solid #eee9e2;
  padding:0 5px;
}

.small-label{
  font-size:8px;
  color:#aaa197;
  letter-spacing:.08em;
  margin-bottom:3px;
  white-space:nowrap;
}

#staff{
  display:block;
  width:100%;
  max-width:175px;
  height:78px;
  overflow:visible;
}

.staff-lines{
  stroke:#aaa196;
  stroke-width:1;
}

.staff-note{
  fill:#fff;
  stroke:#302d29;
  stroke-width:1.5;
}

.staff-accidental{
  font-size:12px;
  fill:#302d29;
  font-family:serif;
}

.staff-clef{
  font-family:serif;
  font-size:43px;
  fill:#665f56;
}

.staff-empty{
  font-size:9px;
  fill:#b1aaa1;
}

/* コード名 */

.chord-area{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.chord-label{
  font-size:8px;
  color:#aaa197;
  letter-spacing:.1em;
}

.chord-name{
  font-size:clamp(23px,3.2vw,32px);
  font-weight:800;
  line-height:1.2;
  min-height:34px;
  margin:2px 0;
  white-space:nowrap;
}

.chord-notes{
  font-size:8px;
  color:#8d857b;
  line-height:1.35;
  min-height:12px;
  overflow-wrap:anywhere;
}

.clear-btn{
  background:#f3f0eb;
  color:#70685f;
  border-radius:7px;
  padding:5px 10px;
  font-size:9px;
  margin-top:5px;
}

.clear-btn:active{
  background:#e8e2d9;
}

/* 状態表示 */

.panel-status{
  border-top:1px solid #f0ece6;
  padding-top:4px;
  font-size:9px;
  color:#92897f;
  line-height:1.3;
  min-height:16px;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* 鍵盤エリア */

.keyboard-card{
  flex:1;
  min-height:0;
  background:var(--paper);
  border-radius:15px;
  padding:8px 10px 7px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.keyboard-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex:0 0 30px;
  margin-bottom:5px;
}

.keyboard-name{
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:750;
  font-size:11px;
}

.color-dot{
  width:8px;
  height:8px;
  border-radius:50%;
}

.main-dot{
  background:var(--pink);
}

.range-controls{
  display:flex;
  align-items:center;
  gap:6px;
}

.range-btn{
  background:#f3f0eb;
  border-radius:8px;
  width:32px;
  height:28px;
  font-size:18px;
  color:#625c55;
}

.range-btn:active{
  background:#e8e2d9;
}

.range-text{
  font-size:10px;
  color:var(--muted);
  min-width:75px;
  text-align:center;
}

/* 鍵盤と五線譜のスクロール領域 */

.keyboard-scroll{
  flex:1;
  min-height:0;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:thin;
  padding:2px 2px 5px;
  touch-action:pan-x;
  -webkit-overflow-scrolling:touch;
}

/* 鍵盤ごとに独立した小さな五線譜 */

.keyboard-notation{
  display:block;
  height:64px;
  margin:0 0 5px;
  pointer-events:none;
  overflow:visible;
}

.notation-cell{
  fill:#fffefa;
  stroke:#e9e3da;
  stroke-width:1;
}

.notation-staff-line{
  stroke:#bcb4aa;
  stroke-width:.8;
}

.notation-note{
  fill:#302d29;
  stroke:none;
}

.notation-accidental{
  fill:#302d29;
  font-family:serif;
  font-size:7px;
  text-anchor:middle;
}

.notation-ledger{
  stroke:#aaa196;
  stroke-width:.9;
}

/* 鍵盤本体 */

.keys{
  position:relative;
  display:block;
  height:100%;
  min-height:0;
  width:max-content;
  padding:0;
  margin:0;
  touch-action:none;
  --white-count:18;
}

.key{
  position:absolute;
  top:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding-bottom:15px;
  border:1px solid #d9d3ca;
  border-radius:0 0 9px 9px;
  color:#5e5851;
  box-shadow:0 3px 2px #0000000b;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

.key.white{
  left:var(--key-left);
  width:var(--white-key-width);
  height:100%;
  background:#fffefa;
  z-index:1;
}

.key.black{
  left:var(--key-left);
  transform:translateX(-50%);
  width:calc(var(--white-key-width) * .62);
  height:69%;
  background:#494641;
  color:#fff;
  border:1px solid #35322f;
  border-radius:0 0 7px 7px;
  padding-bottom:10px;
  z-index:3;
  box-shadow:0 3px 4px #00000030;
}

.key.selected.main-selected{
  background:#f1cbd0;
  border-color:var(--pink-dark);
  color:#70454b;
}

.key.black.selected{
  background:#80666b;
  border-color:#bd7884;
}

.key:active{
  transform:translateY(1px);
}

.key.black:active{
  transform:translateX(-50%) translateY(1px);
}

.key-name{
  font-size:15px;
  font-weight:650;
  pointer-events:none;
}

.key-octave{
  font-size:10px;
  opacity:.65;
  margin-top:3px;
  pointer-events:none;
}

.key-degree{
  position:absolute;
  top:11px;
  left:0;
  right:0;
  text-align:center;
  font-size:13px;
  font-weight:750;
  pointer-events:none;
}

.key.black .key-degree{
  top:8px;
  font-size:10px;
}

.key.black .key-name{
  font-size:12px;
}

.keyboard-footer{
  flex:0 0 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding-top:4px;
}

.keyboard-hint{
  font-size:9px;
  color:#aaa197;
}

.mode-indicator{
  font-size:9px;
  color:#a69d93;
  letter-spacing:.05em;
}

/* バージョン */

.version-info{
  flex:0 0 13px;
  text-align:center;
  font-size:9px;
  color:#aaa197;
  letter-spacing:.08em;
}

/* タブレット・スマートフォン */

@media(max-width:600px){
  :root{
    --white-key-width:48px;
  }

  .app{
    padding:5px 7px 2px;
    gap:5px;
  }

  .control-panel{
    flex-basis:23%;
    min-height:137px;
    padding:7px 7px 5px;
    border-radius:12px;
  }

  .control-main{
    grid-template-columns:minmax(0,1.35fr) minmax(65px,.7fr) minmax(72px,.7fr);
    gap:5px;
  }

  .bass-heading{
    margin-bottom:5px;
  }

  .bass-title{
    font-size:9px;
  }

  .bass-hint{
    font-size:7px;
  }

  .bass-buttons{
    gap:3px;
  }

  .bass-btn{
    height:clamp(25px,3.5vh,32px);
    font-size:10px;
    border-radius:5px;
  }

  .staff-area{
    padding:0 3px;
  }

  #staff{
    height:65px;
  }

  .chord-name{
    font-size:23px;
    min-height:29px;
  }

  .chord-notes{
    font-size:7px;
  }

  .clear-btn{
    padding:5px 7px;
    font-size:8px;
    margin-top:4px;
  }

  .keyboard-card{
    padding:6px 6px 5px;
    border-radius:12px;
  }

  .keyboard-heading{
    flex-basis:27px;
    margin-bottom:3px;
  }

  .keyboard-notation{
    height:64px;
    margin-bottom:4px;
  }

  .key{
    padding-bottom:10px;
  }

  .key-name{
    font-size:13px;
  }

  .key-octave{
    font-size:9px;
  }

  .key-degree{
    font-size:11px;
    top:8px;
  }

  .keyboard-footer{
    flex-basis:19px;
  }
}

@media(max-width:370px){
  .control-main{
    grid-template-columns:minmax(0,1.3fr) minmax(58px,.65fr) minmax(65px,.65fr);
    gap:3px;
  }

  .bass-btn{
    font-size:9px;
  }

  .bass-hint{
    display:none;
  }

  .chord-name{
    font-size:20px;
  }

  .staff-area{
    padding:0 1px;
  }
}
</style>
</head>

<body>
<div class="app">

<section class="control-panel">

  <div class="control-main">

    <div class="bass-area">
      <div class="bass-heading">
        <div class="bass-title">BASS / ベース音</div>
        <div class="bass-hint">選ぶとコード判定</div>
      </div>

      <div class="bass-buttons" id="bassButtons">
        <button class="bass-btn" data-note="0">C</button>
        <button class="bass-btn" data-note="1">D♭</button>
        <button class="bass-btn" data-note="2">D</button>
        <button class="bass-btn" data-note="3">E♭</button>

        <button class="bass-btn" data-note="4">E</button>
        <button class="bass-btn" data-note="5">F</button>
        <button class="bass-btn" data-note="6">G♭</button>
        <button class="bass-btn" data-note="7">G</button>

        <button class="bass-btn" data-note="8">A♭</button>
        <button class="bass-btn" data-note="9">A</button>
        <button class="bass-btn" data-note="10">B♭</button>
        <button class="bass-btn" data-note="11">B</button>
      </div>
    </div>

    <div class="staff-area">
      <div class="small-label">CHORD TONES</div>

      <svg id="staff" viewBox="0 0 170 90"
           xmlns="http://www.w3.org/2000/svg">

        <g class="staff-lines">
          <line x1="7" y1="20" x2="163" y2="20"/>
          <line x1="7" y1="32" x2="163" y2="32"/>
          <line x1="7" y1="44" x2="163" y2="44"/>
          <line x1="7" y1="56" x2="163" y2="56"/>
          <line x1="7" y1="68" x2="163" y2="68"/>
        </g>

        <text x="5" y="67" class="staff-clef">𝄞</text>

        <g id="staffNotes"></g>
      </svg>
    </div>

    <div class="chord-area">
      <div class="chord-label">CHORD NAME</div>
      <div class="chord-name" id="chordName">---</div>
      <div class="chord-notes" id="chordNotes">音を選択してね</div>
      <button class="clear-btn" id="clearAll">クリア</button>
    </div>

  </div>

  <div class="panel-status" id="degreeInfo">
    ベース音を選ぶとコード判定モードになるよ
  </div>

</section>

<!-- 鍵盤 -->

<section class="keyboard-card">

  <div class="keyboard-heading">

    <div class="keyboard-name">
      <span class="color-dot main-dot"></span>
      メイン鍵盤
    </div>

    <div class="range-controls">
      <button class="range-btn" id="mainLeft">‹</button>
      <span class="range-text" id="mainRange"></span>
      <button class="range-btn" id="mainRight">›</button>
    </div>

  </div>

  <div class="keyboard-scroll" id="mainScroll">

    <!-- 鍵盤ごとに独立した小さな五線譜 -->
    <svg class="keyboard-notation" id="keyboardNotation"
         xmlns="http://www.w3.org/2000/svg">
      <g id="keyboardStaffNotes"></g>
    </svg>

    <div class="keys" id="mainKeys"></div>

  </div>

  <div class="keyboard-footer">
    <div class="keyboard-hint" id="keyboardHint">
      鍵盤を押して演奏
    </div>
    <div class="mode-indicator" id="modeIndicator">
      PLAY MODE
    </div>
  </div>

</section>

<div class="version-info" id="versionInfo">
  おとりす｜マイピア Ver.1.5
</div>

</div>

<script>
/* バージョン情報 */

const APP_VERSION="1.5";

document.getElementById("versionInfo").textContent=
  "おとりす｜マイピア Ver."+APP_VERSION;


/* 音名 */

const NOTE_NAMES=[
  "C","C♯","D","D♯","E","F",
  "F♯","G","G♯","A","A♯","B"
];

const FLAT_NAMES=[
  "C","D♭","D","E♭","E","F",
  "G♭","G","A♭","A","B♭","B"
];

const BLACK=[1,3,6,8,10];


/* 状態 */

let mainStart=60;
let mainSelected=new Set();
let bassSelected=null;

let audioContext=null;
let activeVoices=new Map();


/* 音源 */

function getAudio(){
  if(!audioContext){
    const AudioContextClass=
      window.AudioContext||window.webkitAudioContext;

    if(!AudioContextClass)return null;

    audioContext=new AudioContextClass();
  }

  if(audioContext.state==="suspended"){
    audioContext.resume().catch(error=>console.log(error));
  }

  return audioContext;
}

function frequency(midi){
  return 440*Math.pow(2,(midi-69)/12);
}

function startSound(voiceId,midi){
  const ctx=getAudio();
  if(!ctx)return;

  stopSound(voiceId);

  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  const volume=ctx.createGain();

  osc.type="triangle";
  osc.frequency.value=frequency(midi);
  volume.gain.value=.32;

  gain.gain.setValueAtTime(.0001,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    .16,ctx.currentTime+.025
  );

  osc.connect(gain);
  gain.connect(volume);
  volume.connect(ctx.destination);

  osc.start();

  activeVoices.set(voiceId,{osc,gain});
}

function stopSound(voiceId){
  const voice=activeVoices.get(voiceId);
  if(!voice)return;

  const ctx=getAudio();
  if(!ctx)return;

  const now=ctx.currentTime;

  voice.gain.gain.cancelScheduledValues(now);
  voice.gain.gain.setTargetAtTime(.0001,now,.04);

  try{
    voice.osc.stop(now+.2);
  }catch(error){}

  activeVoices.delete(voiceId);
}

function stopAllSounds(){
  [...activeVoices.keys()].forEach(stopSound);
}


/* 音程 */

function pitchClass(midi){
  return ((midi%12)+12)%12;
}

function octave(midi){
  return Math.floor(midi/12)-1;
}

function noteName(midi){
  return NOTE_NAMES[pitchClass(midi)]+octave(midi);
}

function shortNote(midi){
  return NOTE_NAMES[pitchClass(midi)];
}

function isBlack(midi){
  return BLACK.includes(pitchClass(midi));
}


/* 度数 */

function degreeName(semitones){
  const degrees={
    0:"1",
    1:"♭2",
    2:"2",
    3:"♭3",
    4:"3",
    5:"4",
    6:"♭5",
    7:"5",
    8:"♯5",
    9:"6",
    10:"♭7",
    11:"7"
  };

  return degrees[
    ((semitones%12)+12)%12
  ];
}

function degreeFor(midi){
  if(bassSelected===null)return "";

  return degreeName(
    pitchClass(midi)-bassSelected
  );
}


/* コード判定 */

const CHORDS=[
  ["m7(♭5)",[0,3,6,10]],
  ["dim7",[0,3,6,9]],
  ["mM7",[0,3,7,11]],
  ["M7(♯5)",[0,4,8,11]],
  ["7(♯5)",[0,4,8,10]],
  ["7(♭5)",[0,4,6,10]],
  ["7sus4",[0,5,7,10]],
  ["m7(♭9)",[0,3,7,10,1]],
  ["7(♭9)",[0,4,7,10,1]],
  ["7(♯9)",[0,4,7,10,3]],
  ["7(♯11)",[0,4,7,10,6]],
  ["7(♭13)",[0,4,7,10,8]],
  ["m13",[0,3,7,10,2,9]],
  ["13",[0,4,7,10,2,9]],
  ["M13",[0,4,7,11,2,9]],
  ["m11",[0,3,7,10,2,5]],
  ["11",[0,4,7,10,2,5]],
  ["M11",[0,4,7,11,2,5]],
  ["m9",[0,3,7,10,2]],
  ["M9",[0,4,7,11,2]],
  ["9",[0,4,7,10,2]],
  ["m7",[0,3,7,10]],
  ["M7",[0,4,7,11]],
  ["7",[0,4,7,10]],
  ["m6",[0,3,7,9]],
  ["6",[0,4,7,9]],
  ["sus2",[0,2,7]],
  ["sus4",[0,5,7]],
  ["aug",[0,4,8]],
  ["dim",[0,3,6]],
  ["m",[0,3,7]],
  ["",[0,4,7]],
  ["(♭5)",[0,4,6]],
  ["(♯5)",[0,4,8]]
];

function detectChord(){
  if(bassSelected===null||mainSelected.size===0){
    return "---";
  }

  const root=bassSelected;
  const intervals=new Set([0]);

  for(const midi of mainSelected){
    intervals.add(
      (pitchClass(midi)-root+12)%12
    );
  }

  let best=null;
  let bestScore=Infinity;

  for(const chord of CHORDS){
    const name=chord[0];
    const required=chord[1];

    let missing=0;
    let extra=0;

    for(const interval of required){
      if(!intervals.has(interval))missing++;
    }

    for(const interval of intervals){
      if(!required.includes(interval))extra++;
    }

    const score=
      missing*2.2+
      extra*10-
      required.length*.025;

    if(score<bestScore){
      bestScore=score;
      best=name;
    }
  }

  if(best===null)return "---";

  return FLAT_NAMES[root]+best;
}


/* ベース音選択 */

function renderBassButtons(){
  document.querySelectorAll(".bass-btn").forEach(button=>{
    const note=Number(button.dataset.note);

    button.classList.toggle(
      "active",
      bassSelected===note
    );
  });
}

document.querySelectorAll(".bass-btn").forEach(button=>{
  button.addEventListener("click",()=>{
    const note=Number(button.dataset.note);

    if(bassSelected===note){

      bassSelected=null;
      mainSelected.clear();
      stopAllSounds();

    }else{

      stopSound("bass");
      bassSelected=note;

      const bassMidi=48+note;
      startSound("bass",bassMidi);
    }

    renderAll();
  });
});


/* 鍵盤 */

function createKey(midi,whiteIndex){
  const key=document.createElement("button");

  key.type="button";

  const black=isBlack(midi);

  key.className="key "+(black?"black":"white");

  if(mainSelected.has(midi)){
    key.classList.add("selected","main-selected");
  }

  const name=document.createElement("span");
  name.className="key-name";
  name.textContent=shortNote(midi);

  const oct=document.createElement("span");
  oct.className="key-octave";
  oct.textContent=octave(midi);

  key.appendChild(name);
  key.appendChild(oct);

  if(bassSelected!==null){
    const degree=document.createElement("span");

    degree.className="key-degree";
    degree.textContent=degreeFor(midi);

    key.appendChild(degree);
  }

  if(black){
    key.style.setProperty(
      "--key-left",
      `calc(${whiteIndex+1} * var(--white-key-width))`
    );
  }else{
    key.style.setProperty(
      "--key-left",
      `calc(${whiteIndex} * var(--white-key-width))`
    );
  }

  let pointerDown=false;

  key.addEventListener("pointerdown",e=>{
    e.preventDefault();

    if(bassSelected!==null){

      const voiceId="main:"+midi;

      if(mainSelected.has(midi)){
        mainSelected.delete(midi);
        stopSound(voiceId);
      }else{
        mainSelected.add(midi);
        startSound(voiceId,midi);
      }

      renderAll();

    }else{

      pointerDown=true;

      getAudio();
      startSound("main:"+midi,midi);

      try{
        key.setPointerCapture(e.pointerId);
      }catch(error){}
    }
  });

  const release=()=>{
    if(pointerDown){
      pointerDown=false;
      stopSound("main:"+midi);
    }
  };

  key.addEventListener("pointerup",release);
  key.addEventListener("pointerleave",release);
  key.addEventListener("pointercancel",release);
  key.addEventListener("lostpointercapture",release);

  return key;
}


/* SVG作成 */

function createSvgElement(name,attributes){
  const element=document.createElementNS(
    "http://www.w3.org/2000/svg",
    name
  );

  Object.entries(attributes).forEach(([key,value])=>{
    element.setAttribute(key,value);
  });

  return element;
}


/* 鍵盤ごとの五線譜 */

const KEY_STAFF_SPELLINGS={
  0:{letter:"C",acc:""},
  1:{letter:"C",acc:"♯"},
  2:{letter:"D",acc:""},
  3:{letter:"D",acc:"♯"},
  4:{letter:"E",acc:""},
  5:{letter:"F",acc:""},
  6:{letter:"F",acc:"♯"},
  7:{letter:"G",acc:""},
  8:{letter:"G",acc:"♯"},
  9:{letter:"A",acc:""},
  10:{letter:"A",acc:"♯"},
  11:{letter:"B",acc:""}
};

const KEY_STAFF_LETTERS=["C","D","E","F","G","A","B"];

/*
  ト音記号の五線譜を基準に音符の位置を計算。

  E4：五線譜の一番下の線
  F4：その上の間
  G4：下から2本目の線
  ...
  F5：一番上の線

  音符は黒い丸のみ。
  棒は付けない。
*/

function getKeyStaffPosition(midi){
  const spelling=KEY_STAFF_SPELLINGS[pitchClass(midi)];

  const letterIndex=
    KEY_STAFF_LETTERS.indexOf(spelling.letter);

  const diatonic=
    octave(midi)*7+letterIndex;

  const e4Diatonic=4*7+2;

  const step=diatonic-e4Diatonic;

  const bottomY=47;
  const stepHeight=2.25;

  return {
    spelling,
    y:bottomY-step*stepHeight,
    step
  };
}

/*
  各音にひとつずつ独立した枠を作る。

  枠の中心は実際の鍵盤の中心と一致。
  白鍵・黒鍵ともに対応する位置に表示する。
*/

function renderKeyboardNotation(notes,whiteCount){
  const svg=document.getElementById("keyboardNotation");
  const group=document.getElementById("keyboardStaffNotes");

  group.innerHTML="";

  const keyWidth=parseFloat(
    getComputedStyle(document.documentElement)
      .getPropertyValue("--white-key-width")
  );

  const totalWidth=whiteCount*keyWidth;

  svg.setAttribute("width",totalWidth);
  svg.setAttribute("height","64");
  svg.setAttribute("viewBox",`0 0 ${totalWidth} 64`);

  /*
    各鍵盤の中心位置を計算。
    黒鍵は白鍵の境界、白鍵は白鍵の中央。
  */

  const centers=notes.map(note=>{
    return note.black
      ?(note.whiteIndex+1)*keyWidth
      :(note.whiteIndex+.5)*keyWidth;
  });

  notes.forEach((note,index)=>{

    const centerX=centers[index];

    const left=index===0
      ?0
      :(centers[index-1]+centerX)/2;

    const right=index===notes.length-1
      ?totalWidth
      :(centerX+centers[index+1])/2;

    const cellWidth=right-left;

    const padding=Math.min(2,cellWidth*.08);

    const cellLeft=left+padding;
    const cellRight=right-padding;

    const cellGroup=createSvgElement("g",{
      class:"notation-cell-group"
    });

    /* 独立した譜面の枠 */

    cellGroup.appendChild(
      createSvgElement("rect",{
        x:cellLeft,
        y:"3",
        width:Math.max(1,cellRight-cellLeft),
        height:"57",
        rx:"2",
        class:"notation-cell"
      })
    );

    /* その枠の中だけに五線を描く */

    const staffLeft=cellLeft+2;
    const staffRight=cellRight-2;

    [29,33.5,38,42.5,47].forEach(y=>{
      cellGroup.appendChild(
        createSvgElement("line",{
          x1:staffLeft,
          x2:staffRight,
          y1:y,
          y2:y,
          class:"notation-staff-line"
        })
      );
    });

    const position=getKeyStaffPosition(note.midi);
    const noteY=position.y;
    const step=position.step;

    /* 五線譜の外側に必要な加線 */

    if(step>4){
      for(let s=6;s<=step;s+=2){
        const ledgerY=47-s*2.25;

        cellGroup.appendChild(
          createSvgElement("line",{
            x1:centerX-5,
            x2:centerX+5,
            y1:ledgerY,
            y2:ledgerY,
            class:"notation-ledger"
          })
        );
      }
    }

    if(step<0){
      for(let s=-2;s>=step;s-=2){
        const ledgerY=47-s*2.25;

        cellGroup.appendChild(
          createSvgElement("line",{
            x1:centerX-5,
            x2:centerX+5,
            y1:ledgerY,
            y2:ledgerY,
            class:"notation-ledger"
          })
        );
      }
    }

    /* シャープ記号 */

    if(position.spelling.acc){
      const accidental=createSvgElement("text",{
        x:centerX-5,
        y:noteY+2,
        class:"notation-accidental"
      });

      accidental.textContent=position.spelling.acc;
      cellGroup.appendChild(accidental);
    }

    /* 黒い音符 */

    cellGroup.appendChild(
      createSvgElement("ellipse",{
        cx:centerX,
        cy:noteY,
        rx:"3.1",
        ry:"2.5",
        class:"notation-note"
      })
    );

    group.appendChild(cellGroup);
  });
}


/* 鍵盤描画 */

function renderOneKeyboard(containerId,start,count){
  const container=document.getElementById(containerId);

  container.innerHTML="";

  const whiteNotes=[];
  const blackNotes=[];
  const notationNotes=[];

  let whiteIndex=0;

  for(let i=0;i<count;i++){
    const midi=start+i;
    const black=isBlack(midi);

    if(black){
      blackNotes.push({
        midi,
        whiteIndex:whiteIndex-1
      });

      notationNotes.push({
        midi,
        black:true,
        whiteIndex:whiteIndex-1
      });

    }else{
      whiteNotes.push({
        midi,
        whiteIndex:whiteIndex
      });

      notationNotes.push({
        midi,
        black:false,
        whiteIndex
      });

      whiteIndex++;
    }
  }

  container.style.setProperty(
    "--white-count",
    whiteNotes.length
  );

  container.style.width=
    `calc(${whiteNotes.length} * var(--white-key-width))`;

  whiteNotes.forEach(item=>{
    container.appendChild(
      createKey(item.midi,item.whiteIndex)
    );
  });

  blackNotes.forEach(item=>{
    container.appendChild(
      createKey(item.midi,item.whiteIndex)
    );
  });

  /* 鍵盤と同じ位置に独立した五線譜を描画 */

  renderKeyboardNotation(notationNotes,whiteNotes.length);
}

function renderKeyboard(){
  renderOneKeyboard("mainKeys",mainStart,31);

  document.getElementById("mainRange").textContent=
    noteName(mainStart)+" ～ "+noteName(mainStart+30);
}


/* 上部のコード用五線譜 */

const STAFF_SPELLINGS={
  0:{letter:"C",acc:""},
  1:{letter:"D",acc:"♭"},
  2:{letter:"D",acc:""},
  3:{letter:"E",acc:"♭"},
  4:{letter:"E",acc:""},
  5:{letter:"F",acc:""},
  6:{letter:"G",acc:"♭"},
  7:{letter:"G",acc:""},
  8:{letter:"A",acc:"♭"},
  9:{letter:"A",acc:""},
  10:{letter:"B",acc:"♭"},
  11:{letter:"B",acc:""}
};

const STAFF_LETTERS=["C","D","E","F","G","A","B"];

function renderStaff(){
  const group=document.getElementById("staffNotes");

  group.innerHTML="";

  const noteSet=new Set(
    [...mainSelected].map(m=>pitchClass(m))
  );

  if(bassSelected!==null){
    noteSet.add(bassSelected);
  }

  if(noteSet.size===0){
    const empty=createSvgElement("text",{
      x:"105",
      y:"48",
      "text-anchor":"middle",
      "class":"staff-empty"
    });

    empty.textContent="音を選択";
    group.appendChild(empty);

    return;
  }

  const root=bassSelected!==null?bassSelected:0;

  const pcs=[...noteSet].sort((a,b)=>{
    return (
      (a-root+12)%12
    )-(
      (b-root+12)%12
    );
  });

  const notes=[];

  let previousLetter=-1;
  let currentOctave=4;

  pcs.forEach((pc,index)=>{
    const spelling=STAFF_SPELLINGS[pc];

    const letterIndex=
      STAFF_LETTERS.indexOf(spelling.letter);

    if(index>0 && letterIndex<=previousLetter){
      currentOctave++;
    }

    previousLetter=letterIndex;

    const diatonic=
      currentOctave*7+letterIndex;

    notes.push({
      pc,
      letter:spelling.letter,
      accidental:spelling.acc,
      diatonic
    });
  });

  const minStep=Math.min(...notes.map(n=>n.diatonic));
  const maxStep=Math.max(...notes.map(n=>n.diatonic));

  const centerStep=(minStep+maxStep)/2;

  const centerY=44;
  const stepHeight=7;

  const noteX=108;

  notes.forEach(note=>{
    const y=centerY-
      (note.diatonic-centerStep)*stepHeight;

    if(note.accidental){
      const accidental=createSvgElement("text",{
        x:noteX-19,
        y:y+4,
        "text-anchor":"middle",
        "class":"staff-accidental"
      });

      accidental.textContent=note.accidental;
      group.appendChild(accidental);
    }

    const noteHead=createSvgElement("ellipse",{
      cx:noteX,
      cy:y,
      rx:"7.2",
      ry:"4.8",
      transform:`rotate(-18 ${noteX} ${y})`,
      class:"staff-note"
    });

    group.appendChild(noteHead);

    if(y<20){
      for(
        let lineY=14;
        lineY>=y-1;
        lineY-=14
      ){
        const ledger=createSvgElement("line",{
          x1:noteX-12,
          x2:noteX+12,
          y1:lineY,
          y2:lineY,
          class:"staff-lines"
        });

        group.appendChild(ledger);
      }
    }

    if(y>68){
      for(
        let lineY=78;
        lineY<=y+1;
        lineY+=14
      ){
        const ledger=createSvgElement("line",{
          x1:noteX-12,
          x2:noteX+12,
          y1:lineY,
          y2:lineY,
          class:"staff-lines"
        });

        group.appendChild(ledger);
      }
    }
  });
}


/* 情報表示 */

function renderInfo(){
  const chord=detectChord();

  document.getElementById("chordName").textContent=chord;

  const selectedNotes=[...mainSelected]
    .sort((a,b)=>a-b)
    .map(m=>shortNote(m));

  document.getElementById("chordNotes").textContent=
    selectedNotes.length
    ?"選択音："+selectedNotes.join("・")
    :"音を選択してね";

  const count=mainSelected.size;

  if(bassSelected===null){

    document.getElementById("degreeInfo").textContent=
      "ベース音を選ぶとコード判定モードになるよ";

  }else{

    const degrees=[...mainSelected]
      .sort((a,b)=>a-b)
      .map(m=>shortNote(m)+"="+degreeFor(m));

    document.getElementById("degreeInfo").textContent=
      "ROOT "+FLAT_NAMES[bassSelected]+
      "　｜　選択 "+count+"音"+
      (degrees.length?"　｜　"+degrees.join(" / "):"");
  }
}


/* モード表示 */

function renderMode(){
  const selecting=bassSelected!==null;

  document.getElementById("keyboardHint").textContent=
    selecting
    ?"鍵盤をタップしてコードの音を選択"
    :"鍵盤を押して演奏";

  document.getElementById("modeIndicator").textContent=
    selecting
    ?"CHORD SELECT MODE"
    :"PLAY MODE";
}


/* 全体更新 */

function renderAll(){
  renderKeyboard();
  renderBassButtons();
  renderInfo();
  renderStaff();
  renderMode();
}


/* 音域移動 */

document.getElementById("mainLeft").onclick=()=>{
  mainStart-=12;
  renderAll();
};

document.getElementById("mainRight").onclick=()=>{
  mainStart+=12;
  renderAll();
};


/* 選択クリア */

document.getElementById("clearAll").onclick=()=>{
  mainSelected.clear();
  bassSelected=null;

  stopAllSounds();

  renderAll();
};


/* 初期表示 */

renderAll();
