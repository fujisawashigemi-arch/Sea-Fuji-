
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f6f3ee">
<title>マイスコア｜オトリス</title>

<style>
:root{
  --bg:#f6f3ee;
  --paper:#fff;
  --ink:#292722;
  --muted:#89847b;
  --line:#ded9cf;
  --green:#39845c;
  --green-light:#e4f1e8;
  --orange:#d88b42;
  --white-key-width:39px;
}

/* =========================================
   【基本レイアウト】ここから
========================================= */

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",
    "Yu Gothic",Meiryo,sans-serif;
}

button,input,select{font:inherit}

button{
  border:1px solid var(--line);
  background:white;
  color:var(--ink);
  border-radius:9px;
  padding:9px 12px;
  cursor:pointer;
  touch-action:manipulation;
}

button:active{transform:scale(.97)}
button.active{
  background:var(--green-light);
  border-color:var(--green);
  color:#24613e;
}
button:disabled{opacity:.35;cursor:default}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(246,243,238,.96);
  border-bottom:1px solid var(--line);
  padding:10px 12px;
  backdrop-filter:blur(10px);
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:9px;
}

.logo{
  font-weight:800;
  letter-spacing:.04em;
  font-size:18px;
}

.logo small{
  font-size:10px;
  color:var(--muted);
  font-weight:500;
  margin-left:5px;
}

.top-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.top-actions button{
  padding:7px 9px;
  font-size:12px;
}

.meta{
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr;
  gap:7px;
}

.meta label{
  display:block;
  font-size:10px;
  color:var(--muted);
  margin-bottom:3px;
}

.meta input,.meta select{
  width:100%;
  min-width:0;
  border:1px solid var(--line);
  background:white;
  border-radius:7px;
  padding:8px;
  color:var(--ink);
}

main{padding:12px 10px 280px}

.paper{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 2px 8px #00000008;
  overflow:hidden;
}

.score-heading{
  text-align:center;
  padding:22px 10px 10px;
}

.score-heading h1{
  font-size:22px;
  margin:0 0 5px;
  font-weight:700;
}

.score-heading p{
  margin:0;
  color:var(--muted);
  font-size:11px;
}

#score{
  display:block;
  width:100%;
  height:auto;
  touch-action:pan-y;
  user-select:none;
}

#status{
  padding:9px 12px;
  color:var(--muted);
  font-size:12px;
  text-align:center;
}

/* =========================================
   【基本レイアウト】ここまで
========================================= */


/* =========================================
   【楽譜の見た目】ここから
========================================= */

.staff-line{stroke:#55514b;stroke-width:1}
.measure-line{stroke:#aaa49a;stroke-width:1}

.grid-quarter{
  stroke:#a7a096;
  stroke-width:1;
  stroke-dasharray:2 4;
  opacity:.68;
}

.grid-eighth{
  stroke:#bdb8af;
  stroke-width:.8;
  stroke-dasharray:1.5 4;
  opacity:.48;
}

.grid-sixteenth{
  stroke:#c9c5bd;
  stroke-width:.7;
  stroke-dasharray:1 4;
  opacity:.34;
}

.cursor-line{
  stroke:#29945b;
  stroke-width:2.5;
  opacity:.95;
  pointer-events:none;
}

.cursor-cap{fill:#29945b;pointer-events:none}

.cursor-handle{
  fill:#29945b;
  stroke:white;
  stroke-width:3;
  cursor:grab;
  touch-action:none;
}

.cursor-handle:active{cursor:grabbing}

.note-head{fill:#292722;stroke:#292722;stroke-width:1}
.note-head.open{fill:white;stroke-width:2}
.note-stem{stroke:#292722;stroke-width:1.6}
.note-flag{
  fill:none;
  stroke:#292722;
  stroke-width:1.7;
  stroke-linecap:round;
}
.note-selected{stroke:#29945b;stroke-width:2.5}
.chord-text{font-size:12px;fill:#4e795e;font-weight:600}
.lyric-text{font-size:11px;fill:#514c45}
.measure-number{font-size:9px;fill:#aaa49a}
.rehearsal-text{font-size:13px;font-weight:bold;fill:#d17c35}
.staff-hit{fill:transparent;cursor:crosshair}
.staff-hit:active{fill:#39845c12}

/* =========================================
   【楽譜の見た目】ここまで
========================================= */


/* =========================================
   【入力パレット】ここから
========================================= */

.bottom-panel{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:20;
  background:rgba(250,248,244,.98);
  border-top:1px solid var(--line);
  box-shadow:0 -4px 18px #0000000b;
  padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  max-height:55vh;
  overflow:auto;
}

.panel-toggle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:7px;
}

.panel-toggle strong{font-size:13px}
.panel-toggle button{font-size:11px;padding:6px 10px}

#panelContent{display:block}

.tool-row,.duration-row,.octave-row,
.mode-row,.cursor-row,.sound-row{
  display:flex;
  align-items:center;
  gap:6px;
  overflow-x:auto;
  padding:3px 0 7px;
  scrollbar-width:thin;
}

.tool-row button,.duration-row button,
.mode-row button,.cursor-row button,.sound-row button{
  flex:none;
  font-size:12px;
  padding:8px 11px;
}

.small-label{
  flex:none;
  color:var(--muted);
  font-size:10px;
  margin-right:2px;
}

.keyboard-wrap{
  background:#e9e5dc;
  border:1px solid #d7d1c6;
  border-radius:10px;
  padding:7px 6px 8px;
  overflow-x:auto;
}

.cursor-position{
  font-size:11px;
  color:var(--muted);
  min-width:75px;
  text-align:center;
}

/* =========================================
   【入力パレット】ここまで
========================================= */


/* =========================================
   【鍵盤の見た目】ここから
========================================= */

.keyboard{
  position:relative;
  display:flex;
  width:max-content;
  height:118px;
  margin:0 auto;
  user-select:none;
  touch-action:manipulation;
}

.white-key{
  position:relative;
  width:var(--white-key-width);
  height:116px;
  flex:none;
  border:1px solid #aaa49a;
  border-radius:0 0 5px 5px;
  background:#fff;
  color:#777;
  padding:0;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:7px;
  font-size:10px;
}

.white-key.pressed{background:#dceee1}

.black-key{
  position:absolute;
  z-index:2;
  width:25px;
  height:70px;
  top:0;
  background:#292722;
  border:1px solid #111;
  border-radius:0 0 4px 4px;
  color:white;
  padding:0;
  font-size:8px;
  box-shadow:0 2px 3px #0004;
}

.black-key.pressed{background:#397c55}

/* =========================================
   【鍵盤の見た目】ここまで
========================================= */


/* =========================================
   【補助ボタン・説明】ここから
========================================= */

.extra-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  padding-top:5px;
}

.extra-actions button{
  font-size:11px;
  padding:7px 10px;
}

#fileInput{display:none}

.help{
  color:var(--muted);
  font-size:10px;
  line-height:1.6;
  padding:5px 2px 0;
}

@media(min-width:700px){
  main{max-width:1050px;margin:auto}
  .bottom-panel{
    padding-left:max(12px,calc((100vw - 1050px)/2));
    padding-right:max(12px,calc((100vw - 1050px)/2));
  }
}

@media print{
  header,.bottom-panel,#status{display:none!important}
  body{background:white}
  main{padding:0}
  .paper{border:0;box-shadow:none}
}

/* =========================================
   【補助ボタン・説明】ここまで
========================================= */

</style>
</head>

<body>

     【ヘッダー・曲情報】ここから
========================================= -->

<!-- =========================================

========================================= -->


<!-- =========================================
     【楽譜表示エリア】ここから
========================================= -->

<main>
  <div class="paper">
    <div class="score-heading">
      <h1 id="displayTitle">新しい曲</h1>
      <p><span id="displayKey">C</span>　・　♩ = <span id="displayTempo">100</span></p>

<!-- =========================================

<!-- =========================================
     【入力パレット画面】ここから
========================================= -->

<div class="bottom-panel">
  <div class="panel-toggle">
    <strong>音符入力パレット</strong>
    <button id="collapseBtn">閉じる ▲</button>
  </div>

  <div id="panelContent">

    <div class="sound-row">

      <button class="duration" data-duration="1">𝅘𝅥𝅯 16分</button>
      <button class="duration" data-duration="8">𝅗𝅥 2分</button>
      <button class="duration" data-duration="16">𝅝 全音</button>
      <button class="duration" data-duration="0" id="restBtn">休符</button>

    <div class="octave-row">

</div>

<input type="file" id="fileInput" accept=".json,application/json">

     【入力パレット画面】ここまで

<script>
"use strict";

/* =========================================
   【基本設定・データ】ここから
========================================= */

const SVG_NS = "http://www.w3.org/2000/svg";
const MEASURE_WIDTH = 220;
const START_X = 60;
const STAFF_TOP = 92;
const SYSTEM_HEIGHT = 190;
const STAFF_SPACING = 12;
const GRID_COUNT = 16;

const WHITE_KEY_WIDTH = 39;
const BLACK_KEY_WIDTH = 25;

let state = {
  title:"新しい曲",
  key:"C",
  tempo:100,
  measures:8,
  systems:2,
  notes:[],
  chords:{},
  lyrics:{},
  marks:{}
};

let selectedTool="pen";
let inputMode="pen";
let soundEnabled=true;
let selectedDuration=4;
let selectedNoteId=null;
let cursor={measure:0,slot:0};
let octaveBase=4;
let undoStack=[];
let redoStack=[];
let audioContext=null;
let activeOscillators=[];
let playTimer=null;
let panelOpen=true;
let cursorDragging=false;

/* =========================================
   【基本設定・データ】ここまで
========================================= */


/* =========================================
   【共通処理・操作履歴】ここから
========================================= */

const $ = id => document.getElementById(id);

function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function snapshot(){
  undoStack.push(JSON.stringify(state));
  if(undoStack.length>80)undoStack.shift();
  redoStack=[];
  updateHistoryButtons();
}

function undo(){
  if(!undoStack.length)return;
  redoStack.push(JSON.stringify(state));
  state=JSON.parse(undoStack.pop());
  selectedNoteId=null;
  cursor.measure=clamp(cursor.measure,0,state.measures-1);
  renderAll();
  updateHistoryButtons();
}

function redo(){
  if(!redoStack.length)return;
  undoStack.push(JSON.stringify(state));
  state=JSON.parse(redoStack.pop());
  selectedNoteId=null;
  cursor.measure=clamp(cursor.measure,0,state.measures-1);
  renderAll();
  updateHistoryButtons();
}

function updateHistoryButtons(){
  $("undoBtn").disabled=undoStack.length===0;
  $("redoBtn").disabled=redoStack.length===0;
}

function showStatus(message){
  $("status").textContent=message;
}

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function measureSystem(measure){
  return Math.floor(measure/4);
}

function measureColumn(measure){
  return measure%4;
}

function measureX(measure){
  return START_X+measureColumn(measure)*MEASURE_WIDTH;
}

function systemY(system){
  return STAFF_TOP+system*SYSTEM_HEIGHT;
}

function noteX(note){
  return measureX(note.measure)+12+
    (note.slot/GRID_COUNT)*(MEASURE_WIDTH-24);
}

function updateCursorPosition(){
  $("cursorPosition").textContent=
    `${cursor.measure+1}小節 ${cursor.slot+1}/16`;

  $("cursorLeftBtn").disabled=
    cursor.measure===0&&cursor.slot===0;

  $("cursorRightBtn").disabled=
    cursor.measure===state.measures-1&&cursor.slot===15;
}

function moveCursorBy(amount){
  let absolute=cursor.measure*16+cursor.slot+amount;
  absolute=clamp(absolute,0,state.measures*16-1);

  cursor.measure=Math.floor(absolute/16);
  cursor.slot=absolute%16;

  selectedNoteId=null;
  renderScore();
  updateCursorPosition();
  showStatus(
    `${cursor.measure+1}小節・${cursor.slot+1}/16 の位置`
  );
}

function cursorFromSvgX(svgX){
  const relative=svgX-START_X;
  const measureOffset=Math.floor(relative/MEASURE_WIDTH);
  const measure=clamp(measureOffset,0,state.measures-1);
  const xInMeasure=relative-measureOffset*MEASURE_WIDTH;
  const innerWidth=MEASURE_WIDTH-24;
  const slot=clamp(
    Math.round((xInMeasure-12)/innerWidth*16),
    0,15
  );

  cursor={measure,slot};
}

function svgCoordinates(event){
  const rect=$("score").getBoundingClientRect();
  return {
    x:(event.clientX-rect.left)/rect.width*1000,
    y:(event.clientY-rect.top)/rect.width*1000
  };
}

/* =========================================
   【共通処理・操作履歴】ここまで
========================================= */


/* =========================================
   【SVG描画補助】ここから
========================================= */

function svgElement(tag,attrs={},parent){
  const el=document.createElementNS(SVG_NS,tag);
  Object.entries(attrs).forEach(([key,value])=>{
    el.setAttribute(key,value);
  });
  if(parent)parent.appendChild(el);
  return el;
}

function svgText(parent,x,y,text,className,attrs={}){
  const el=svgElement("text",{
    x,y,
    class:className||"",
    ...attrs
  },parent);
  el.textContent=text;
  return el;
}

/* =========================================
   【SVG描画補助】ここまで
========================================= */


/* =========================================
   【楽譜表示・小節ガイド】ここから
========================================= */

function renderScore(){
  const svg=$("score");
  svg.innerHTML="";

  const systems=Math.max(1,Math.ceil(state.measures/4));
  const height=Math.max(300,systems*SYSTEM_HEIGHT+65);

  svg.setAttribute("viewBox",`0 0 1000 ${height}`);

  for(let system=0;system<systems;system++){
    const y=systemY(system);
    const firstMeasure=system*4;
    const lastMeasure=Math.min(firstMeasure+4,state.measures);

    for(let line=0;line<5;line++){
      svgElement("line",{
        x1:START_X,
        y1:y+line*STAFF_SPACING,
        x2:START_X+4*MEASURE_WIDTH,
        y2:y+line*STAFF_SPACING,
        class:"staff-line"
      },svg);
    }

    svgText(svg,18,y+47,"𝄞","",{
      "font-size":"48",
      fill:"#292722"
    });

    svgText(svg,43,y+25,"4","",{
      "font-size":"17",
      "font-weight":"bold"
    });

    svgText(svg,43,y+45,"4","",{
      "font-size":"17",
      "font-weight":"bold"
    });

    for(let measure=firstMeasure;measure<lastMeasure;measure++){
      const x=measureX(measure);
      const innerStart=x+12;
      const innerWidth=MEASURE_WIDTH-24;

      svgText(svg,x+3,y-12,String(measure+1),"measure-number");

      svgElement("line",{
        x1:x+MEASURE_WIDTH,
        y1:y,
        x2:x+MEASURE_WIDTH,
        y2:y+48,
        class:"measure-line"
      },svg);

      for(let i=1;i<GRID_COUNT;i++){
        const gx=innerStart+innerWidth*i/GRID_COUNT;
        let cls="grid-sixteenth";

        if(i%4===0)cls="grid-quarter";
        else if(i%2===0)cls="grid-eighth";

        svgElement("line",{
          x1:gx,
          y1:y-3,
          x2:gx,
          y2:y+52,
          class:cls
        },svg);
      }

      const hit=svgElement("rect",{
        x:innerStart,
        y:y-9,
        width:innerWidth,
        height:75,
        class:"staff-hit",
        "data-measure":measure
      },svg);

      hit.addEventListener("click",event=>{
        if(cursorDragging)return;
        if(event.target.closest("[data-note-id]"))return;

        const point=svgCoordinates(event);
        const systemYTop=systemY(measureSystem(measure));
        const localX=point.x-innerStart;
        const rawSlot=Math.round(localX/innerWidth*GRID_COUNT);
        const slot=clamp(rawSlot,0,15);

        cursor={measure,slot};
        selectedNoteId=null;

        if(selectedTool==="eraser"){
          renderScore();
          showStatus("消したい音符をタップしてね");
          return;
        }

        if(selectedTool==="select"){
          renderScore();
          showStatus("音符を選択してね");
          return;
        }

        if(selectedTool==="chord"){
          editChord();
          return;
        }

        if(selectedTool==="lyric"){
          editLyric();
          return;
        }

        if(selectedTool==="mark"){
          editMark();
          return;
        }

        if(inputMode==="pen"&&selectedTool==="pen"){
          const midi=midiFromStaffY(point.y-systemYTop,systemYTop);
          insertPitch(midi);
        }else{
          renderScore();
          updateCursorPosition();
          showStatus(
            `小節 ${measure+1} ・ ${slot+1}/16 の位置を選択中`
          );
        }
      });
    }
  }

  state.notes.forEach(note=>{
    if(note.measure<state.measures)drawNote(svg,note);
  });

  drawCursor(svg);
  updateCursorPosition();
}

/* =========================================
   【カーソル表示・ドラッグ】ここから
========================================= */

function drawCursor(svg){
  const system=measureSystem(cursor.measure);
  const x=measureX(cursor.measure)+12+
    (cursor.slot/GRID_COUNT)*(MEASURE_WIDTH-24);
  const y=systemY(system);

  const group=svgElement("g",{
    id:"cursorGroup",
    transform:`translate(${x},0)`
  },svg);

  svgElement("line",{
    x1:0,y1:y-13,x2:0,y2:y+55,
    class:"cursor-line"
  },group);

  svgElement("path",{
    d:`M -5 ${y-15} L 5 ${y-15} L 0 ${y-7} Z`,
    class:"cursor-cap"
  },group);

  const handle=svgElement("circle",{
    cx:0,cy:y-17,r:12,
    class:"cursor-handle",
    "data-cursor-handle":"true"
  },group);

  handle.addEventListener("pointerdown",event=>{
    event.preventDefault();
    event.stopPropagation();

    cursorDragging=true;
    svg.setPointerCapture(event.pointerId);
    showStatus("緑の丸を動かして入力位置を調整中");
  });

  svg.addEventListener("pointermove",event=>{
    if(!cursorDragging)return;

    const point=svgCoordinates(event);
    cursorFromSvgX(point.x);

    const newX=measureX(cursor.measure)+12+
      (cursor.slot/GRID_COUNT)*(MEASURE_WIDTH-24);

    const currentGroup=$("cursorGroup");
    if(currentGroup){
      currentGroup.setAttribute("transform",`translate(${newX},0)`);
    }

    updateCursorPosition();
  });

  const finishDrag=()=>{
    if(!cursorDragging)return;
    cursorDragging=false;
    renderScore();
    showStatus(
      `${cursor.measure+1}小節・${cursor.slot+1}/16 に移動したよ`
    );
  };

  svg.addEventListener("pointerup",finishDrag);
  svg.addEventListener("pointercancel",finishDrag);
}

/* =========================================
   【音名・音符の描画】ここから
========================================= */

function pitchInfo(midi){
  const names=[
    "C","C♯","D","D♯","E","F",
    "F♯","G","G♯","A","A♯","B"
  ];

  const name=names[((midi%12)+12)%12];
  const octave=Math.floor(midi/12)-1;
  const natural=name[0];

  const naturalMap={C:0,D:1,E:2,F:3,G:4,A:5,B:6};
  const step=octave*7+naturalMap[natural];
  const accidental=name.includes("♯")?"♯":"";

  return {name,octave,step,accidental};
}

function midiFromDiatonicStep(step){
  const letters=["C","D","E","F","G","A","B"];
  const midiBase={C:0,D:2,E:4,F:5,G:7,A:9,B:11};

  const octave=Math.floor(step/7);
  const letter=letters[((step%7)+7)%7];

  return (octave+1)*12+midiBase[letter];
}

function midiFromStaffY(localY,systemTop){
  const bottomLine=systemTop+48;
  const steps=Math.round((bottomLine-localY)/6);
  const e4Step=4*7+2;

  return midiFromDiatonicStep(e4Step+steps);
}

function drawNote(svg,note){
  const system=measureSystem(note.measure);
  const x=noteX(note);
  const yTop=systemY(system);
  const info=pitchInfo(note.midi);

  const e4Step=4*7+2;
  const diatonicOffset=info.step-e4Step;
  const y=yTop+48-diatonicOffset*6;

  const group=svgElement("g",{
    "data-note-id":note.id,
    cursor:"pointer"
  },svg);

  const selected=note.id===selectedNoteId;

  if(selected){
    svgElement("circle",{
      cx:x,cy:y,r:12,
      fill:"#e4f1e8",
      stroke:"#29945b",
      "stroke-width":1.5
    },group);
  }

  if(y>yTop+48){
    for(let ly=yTop+60;ly<=y;ly+=12){
      svgElement("line",{
        x1:x-10,y1:ly,x2:x+10,y2:ly,
        class:"staff-line"
      },group);
    }
  }

  if(y<yTop){
    for(let ly=yTop-12;ly>=y;ly-=12){
      svgElement("line",{
        x1:x-10,y1:ly,x2:x+10,y2:ly,
        class:"staff-line"
      },group);
    }
  }

  const open=note.duration>=8&&!note.rest;

  const head=svgElement("ellipse",{
    cx:x,cy:y,
    rx:7,ry:4.8,
    transform:`rotate(-20 ${x} ${y})`,
    class:"note-head"+(open?" open":"")
  },group);

  if(selected)head.classList.add("note-selected");

  if(note.rest){
    svgText(group,x-5,y+5,"𝄽","",{
      "font-size":"22",
      fill:"#292722"
    });
  }else{
    if(info.accidental){
      svgText(group,x-17,y+4,info.accidental,"",{
        "font-size":"15",
        fill:"#292722"
      });
    }

    if(!open){
      const stemX=x+6;
      const stemTop=y-37;

      svgElement("line",{
        x1:stemX,y1:y,x2:stemX,y2:stemTop,
        class:"note-stem"
      },group);

      if(note.duration<=2){
        const flags=note.duration===1?2:1;

        for(let f=0;f<flags;f++){
          const fy=stemTop+f*9;
          svgElement("path",{
            d:`M ${stemX} ${fy} Q ${stemX+15} ${fy+8} ${stemX+8} ${fy+17}`,
            class:"note-flag"
          },group);
        }
      }
    }
  }

  group.addEventListener("click",event=>{
    event.stopPropagation();

    if(selectedTool==="eraser"){
      snapshot();
      state.notes=state.notes.filter(n=>n.id!==note.id);
      selectedNoteId=null;
      renderAll();
      showStatus("音符を削除したよ");
      return;
    }

    if(selectedTool==="select"){
      selectedNoteId=note.id;
      cursor={measure:note.measure,slot:note.slot};
      renderScore();
      showStatus("音符を選択中");
      return;
    }

    if(selectedTool==="pen"){
      selectedNoteId=note.id;
      cursor={measure:note.measure,slot:note.slot};
      renderScore();
      showStatus("音符を選択したよ");
    }
  });
}

/* =========================================
   【鍵盤の表示】ここから
========================================= */

function buildKeyboard(){
  const keyboard=$("keyboard");
  keyboard.innerHTML="";

  const startMidi=octaveBase*12+12;
  const total=24;

  const whiteNotes=[0,2,4,5,7,9,11];

  const whitePositions={};
  let whiteIndex=0;

  for(let i=0;i<total;i++){
    const midi=startMidi+i;
    const pitch=midi%12;

    if(!whiteNotes.includes(pitch))continue;

    const info=pitchInfo(midi);
    const key=document.createElement("button");

    key.className="white-key";
    key.textContent=info.name+info.octave;
    key.dataset.midi=midi;

    whitePositions[midi]=whiteIndex;

    key.addEventListener("click",()=>{
      handleKeyboardPress(midi,key);
    });

    keyboard.appendChild(key);
    whiteIndex++;
  }

  const blackBefore={
    1:0,
    3:2,
    6:5,
    8:7,
    10:9
  };

  for(let i=0;i<total;i++){
    const midi=startMidi+i;
    const pitch=midi%12;

    if(!(pitch in blackBefore))continue;

    const octaveStart=midi-pitch;
    const naturalMidi=octaveStart+blackBefore[pitch];
    const leftWhiteIndex=whitePositions[naturalMidi];

    if(leftWhiteIndex===undefined)continue;

    const key=document.createElement("button");
    key.className="black-key";
    key.textContent=pitchInfo(midi).name;
    key.dataset.midi=midi;

    const left=
      (leftWhiteIndex+1)*WHITE_KEY_WIDTH-
      BLACK_KEY_WIDTH/2;

    key.style.left=left+"px";

    key.addEventListener("click",()=>{
      handleKeyboardPress(midi,key);
    });

    keyboard.appendChild(key);
  }

  $("octaveLabel").textContent=
    `C${octaveBase}〜B${octaveBase+1}`;
}

function handleKeyboardPress(midi,key){
  key.classList.add("pressed");
  setTimeout(()=>key.classList.remove("pressed"),130);

  if(inputMode==="keyboard"&&selectedTool==="pen"){
    insertPitch(midi);
  }else{
    playMidi(midi);
    const info=pitchInfo(midi);
    showStatus(
      soundEnabled?
      `${info.name}${info.octave} を試し弾き`:
      "音はOFFになっているよ"
    );
  }
}

/* =========================================
   【音の発音・試し弾き】ここから
========================================= */

function midiFrequency(midi){
  return 440*Math.pow(2,(midi-69)/12);
}

function playMidi(midi){
  if(!soundEnabled)return;

  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;

  audioContext=audioContext||new AudioCtx();

  if(audioContext.state==="suspended"){
    audioContext.resume();
  }

  const start=audioContext.currentTime;
  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();

  osc.type="sine";
  osc.frequency.value=midiFrequency(midi);

  gain.gain.setValueAtTime(.0001,start);
  gain.gain.linearRampToValueAtTime(.16,start+.015);
  gain.gain.setValueAtTime(.16,start+.18);
  gain.gain.linearRampToValueAtTime(.0001,start+.32);

  osc.connect(gain);
  gain.connect(audioContext.destination);

  osc.start(start);
  osc.stop(start+.34);

  activeOscillators.push(osc);
  osc.onended=()=>{
    activeOscillators=activeOscillators.filter(item=>item!==osc);
  };
}

function updateSoundButton(){
  $("soundToggleBtn").textContent=soundEnabled?"音 ON":"音 OFF";
  $("soundToggleBtn").classList.toggle("active",soundEnabled);
}

$("soundToggleBtn").addEventListener("click",()=>{
  soundEnabled=!soundEnabled;
  updateSoundButton();

  showStatus(
    soundEnabled?
    "入力音・試し弾きをONにしたよ":
    "入力音・試し弾きをOFFにしたよ"
  );
});

function insertPitch(midi){
  if(cursor.measure>=state.measures){
    showStatus("入力できる小節がないよ");
    return;
  }

  snapshot();

  const note={
    id:"n"+Date.now()+Math.random().toString(16).slice(2),
    measure:cursor.measure,
    slot:cursor.slot,
    midi:midi,
    duration:selectedDuration,
    rest:false
  };

  state.notes.push(note);
  selectedNoteId=note.id;

  if(soundEnabled)playMidi(midi);

  advanceCursor(note.duration);
  renderAll();

  const info=pitchInfo(midi);
  showStatus(`${info.name}${info.octave} を入力したよ`);
}

function insertRest(){
  if(cursor.measure>=state.measures)return;

  snapshot();

  const note={
    id:"n"+Date.now()+Math.random().toString(16).slice(2),
    measure:cursor.measure,
    slot:cursor.slot,
    midi:64,
    duration:selectedDuration,
    rest:true
  };

  state.notes.push(note);
  selectedNoteId=note.id;

  advanceCursor(note.duration);
  renderAll();
  showStatus("休符を入力したよ");
}

function advanceCursor(duration){
  const slots=duration===16?16:duration;
  let absolute=cursor.measure*16+cursor.slot+slots;

  if(absolute>=state.measures*16){
    absolute=state.measures*16-1;
  }

  cursor.measure=Math.floor(absolute/16);
  cursor.slot=absolute%16;
}

  Object.keys(state.lyrics).forEach(k=>{

  Object.keys(state.marks).forEach(k=>{

  });

  cursor.measure=Math.min(cursor.measure,newCount-1);
  renderAll();

/* =========================================
   【音の再生・停止】ここから
========================================= */

function renderAll(){
  syncMeta();
  renderScore();
  updateHistoryButtons();
  updateCursorPosition();
}

function stopPlayback(){
  if(playTimer){
    clearTimeout(playTimer);
    playTimer=null;
  }

  activeOscillators.forEach(osc=>{
    try{osc.stop();}catch(e){}
  });

  activeOscillators=[];
}

function playScore(){
  stopPlayback();

  const notes=state.notes
    .filter(n=>!n.rest)
    .slice()
    .sort((a,b)=>
      (a.measure*16+a.slot)-(b.measure*16+b.slot)
    );

  if(!notes.length){
    showStatus("まだ音符がないよ");
    return;
  }

  const AudioCtx=window.AudioContext||window.webkitAudioContext;

  if(!AudioCtx){
    showStatus("この端末では音を再生できないみたい");
    return;
  }

  audioContext=audioContext||new AudioCtx();
  audioContext.resume();

  const beat=60/state.tempo;
  let index=0;

  function next(){
    if(index>=notes.length){
      showStatus("再生が終わったよ");
      playTimer=null;
      return;
    }

    const note=notes[index];
    const start=audioContext.currentTime;

    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();

    osc.type="sine";
    osc.frequency.value=midiFrequency(note.midi);

    gain.gain.setValueAtTime(.0001,start);
    gain.gain.linearRampToValueAtTime(.16,start+.02);
    gain.gain.setValueAtTime(.16,start+beat*.65);
    gain.gain.linearRampToValueAtTime(.0001,start+beat*.75);

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start(start);
    osc.stop(start+beat*.8);

    activeOscillators.push(osc);

    cursor={measure:note.measure,slot:note.slot};
    renderScore();

    const slots=note.duration===16?16:note.duration;
    const duration=beat*(slots/4);

    index++;
    playTimer=setTimeout(next,Math.max(100,duration*1000));
  }

  showStatus("再生中…");
  next();
}

$("playBtn").addEventListener("click",playScore);

$("stopBtn").addEventListener("click",()=>{
  stopPlayback();
  showStatus("再生を停止したよ");
});

  octaveBase=clamp(octaveBase-1,2,6);
  buildKeyboard();
});

$("octaveUp").addEventListener("click",()=>{
  octaveBase=clamp(octaveBase+1,2,6);
  buildKeyboard();
});
