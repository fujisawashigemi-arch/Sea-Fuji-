<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f3ee">
<title>わたしの曲リスト</title>
<style>
:root{--bg:#f6f3ee;--paper:#fff;--ink:#292722;--muted:#77736b;--line:#e8e2d9;--accent:#667b70;--soft:#edf1ed;--danger:#a34e46}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:14px}
header{padding:18px 16px 12px;max-width:1100px;margin:auto}h1{font-size:21px;margin:0 0 5px;font-weight:700}.sub{color:var(--muted);font-size:12px}
main{max-width:1100px;margin:auto;padding:0 12px 36px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
button,.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 12px;font-size:13px;cursor:pointer}
button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.danger{color:var(--danger)}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #b9c9bf;border-color:var(--accent)}
.search{flex:1;min-width:180px}.toolbar select{width:auto;max-width:190px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field.full{grid-column:1/-1}label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.req{color:var(--danger)}
fieldset{border:0;padding:0;margin:0}.choices{display:flex;gap:7px;flex-wrap:wrap}.choices label{display:flex;align-items:center;gap:5px;background:#f7f6f3;border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink);margin:0}.choices input{width:auto;margin:0}
.formactions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}.hidden{display:none!important}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 2px 8px}.count{color:var(--muted);font-size:12px}
.tablewrap{overflow-x:auto;background:white;border:1px solid var(--line);border-radius:11px}
table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:12px}th{color:var(--muted);font-weight:600;background:#faf9f7;position:sticky;top:0}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfcfa}.song{font-weight:650;font-size:13px}.subline{color:var(--muted);font-size:11px;margin-top:3px}.pill{display:inline-block;background:var(--soft);border-radius:20px;padding:3px 7px;margin:1px;color:#46594e;font-size:11px}.status{color:#555}.rowbtn{padding:5px 8px;font-size:11px}
.tagfilters{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tagfilters button.active{background:var(--soft);border-color:#aab9ae;color:#34483c}
.note{color:var(--muted);font-size:11px;line-height:1.5;margin-top:8px}.empty{text-align:center;color:var(--muted);padding:30px}
@media(max-width:560px){header{padding-top:14px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar select{flex:1;max-width:none}.panel{padding:12px}}
</style>
</head>
<body>
<header><h1>わたしの曲リスト</h1><div class="sub">曲・キー・演奏方法・練習状況をまとめて管理</div></header>
<main>
  <div class="toolbar">
    <input id="search" class="search" placeholder="曲名・アーティスト・メモを検索">
    <button class="primary" id="newBtn">＋ 曲を追加</button>
    <button id="exportBtn">バックアップ保存</button>
    <button id="importBtn">読み込み</button><input type="file" id="fileInput" accept=".json,application/json" class="hidden">
  </div>
  <section id="editor" class="panel hidden">
    <h2 id="formTitle" style="font-size:16px;margin:0 0 12px">曲を追加</h2>
    <form id="songForm">
      <input type="hidden" id="editId">
      <div class="formgrid">
        <div class="field full"><label>① 曲名 <span class="req">＊必須</span></label><input id="title" required maxlength="160" placeholder="曲名"></div>
        <div class="field full"><label>② 曲名の読み仮名</label><input id="reading" placeholder="並べ替えに使う読み仮名（必要に応じて編集）"></div>
        <div class="field"><label>③ キー1</label><select id="key1"></select></div>
        <div class="field"><label>④ キー2</label><select id="key2"></select></div>
        <div class="field full"><label>⑤ 演奏可能項目（複数選択）</label><div class="choices" id="instruments"></div></div>
        <div class="field full"><label>⑥ 現状</label><div class="choices" id="statuses"></div></div>
        <div class="field full"><label>⑦ タグ（複数選択・新しいタグも追加可能）</label><div id="tagChoices" class="choices"></div><div style="display:flex;gap:7px;margin-top:8px"><input id="newTag" placeholder="新しいタグ名"><button type="button" id="addTagBtn">タグを追加</button></div></div>
        <div class="field"><label>⑧ アーティスト</label><input id="artist" placeholder="アーティスト名"></div>
        <div class="field"><label>⑨ アーティストのよみ</label><input id="artistReading" placeholder="並べ替え用の読み仮名"></div>
        <div class="field"><label>⑩ リリース年</label><input id="year" inputmode="numeric" maxlength="4" placeholder="例：1985"></div>
        <div class="field full"><label>⑪ フリーメモ・備考</label><textarea id="memo" rows="3" placeholder="自由にメモ"></textarea></div>
      </div>
      <div class="formactions"><button class="primary" type="submit">保存する</button><button type="button" id="cancelBtn">キャンセル</button></div>
      <div class="note">読み仮名は日本語の漢字から正確に自動判定できないため、ここで確認・修正できるようにしています。曲名がひらがな・カタカナの場合は自動で読み欄に反映します。</div>
    </form>
  </section>
  <div class="panel">
    <div class="toolbar" style="margin:0">
      <label style="margin:0;white-space:nowrap">並べ替え</label>
      <select id="sort"><option value="reading">曲名の読み</option><option value="artistReading">アーティストの読み</option><option value="added">追加順</option><option value="title">曲名</option><option value="year">リリース年</option></select>
      <select id="direction"><option value="asc">昇順</option><option value="desc">降順</option></select>
      <button id="clearFilter">絞り込み解除</button>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:9px">タグで絞り込み</div><div id="tagFilters" class="tagfilters"></div>
  </div>
  <div class="listhead"><strong>曲リスト</strong><span id="count" class="count">0曲</span></div>
  <div class="tablewrap"><table><thead><tr><th>曲名</th><th>キー</th><th>演奏可能</th><th>現状</th><th>タグ</th><th>アーティスト</th><th>年</th><th>操作</th></tr></thead><tbody id="songRows"></tbody></table><div id="empty" class="empty">まだ曲が登録されていません。<br>「＋ 曲を追加」から登録してね。</div></div>
  <div class="note">データはこのブラウザ内に自動保存されます。機種変更・別端末への移行時は「バックアップ保存」でJSONファイルを作り、移行先で「読み込み」をしてください。ブラウザのデータ消去前にもバックアップを保存してください。</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
const KEYS=['','C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const INSTR=['歌','ギター','ピアノ','生ピアノ','三味線','笛'];
const STATUS=['歌える','練習中','歌いたい'];
let songs=[],tags=[],activeTag='';
const STORE='mySongList_v1';
function load(){try{const d=JSON.parse(localStorage.getItem(STORE)||'{}');songs=Array.isArray(d.songs)?d.songs:[];tags=Array.isArray(d.tags)?d.tags:[]}catch(e){songs=[];tags=[]}}
function persist(){localStorage.setItem(STORE,JSON.stringify({songs,tags}))}
function fillSelect(id,values){$(id).innerHTML=values.map(v=>`<option value="${esc(v)}">${v||'未設定'}</option>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function checks(id,values,name){$(id).innerHTML=values.map(v=>`<label><input type="checkbox" name="${name}" value="${esc(v)}">${esc(v)}</label>`).join('')}
function checked(name){return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(x=>x.value)}
function setChecks(name,values){document.querySelectorAll(`input[name="${name}"]`).forEach(x=>x.checked=values.includes(x.value))}
function renderTags(){ $('tagChoices').innerHTML=tags.map(t=>`<label><input type="checkbox" name="songTags" value="${esc(t)}">${esc(t)}</label>`).join('')||'<span class="note">タグはまだありません</span>'; $('tagFilters').innerHTML=tags.map(t=>`<button type="button" data-tag="${esc(t)}" class="${activeTag===t?'active':''}">${esc(t)}</button>`).join('') }
function openForm(song){$('editor').classList.remove('hidden');$('formTitle').textContent=song?'曲を編集':'曲を追加';$('editId').value=song?.id||'';$('title').value=song?.title||'';$('reading').value=song?.reading||'';$('key1').value=song?.key1||'';$('key2').value=song?.key2||'';$('artist').value=song?.artist||'';$('artistReading').value=song?.artistReading||'';$('year').value=song?.year||'';$('memo').value=song?.memo||'';setChecks('instrument',song?.instruments||[]);setChecks('status',song?.status?[song.status]:[]);setChecks('songTags',song?.tags||[]);$('editor').scrollIntoView({behavior:'smooth',block:'start'})}
function closeForm(){$('editor').classList.add('hidden');$('songForm').reset();$('editId').value=''}
function norm(s){return (s||'').trim().toLocaleLowerCase()}
function render(){
 renderTags();let q=norm($('search').value),sort=$('sort').value,dir=$('direction').value==='asc'?1:-1;
 let data=songs.filter(s=>(!activeTag||(s.tags||[]).includes(activeTag))&&(!q||[s.title,s.reading,s.artist,s.artistReading,s.memo].some(v=>norm(v).includes(q))));
 data.sort((a,b)=>{let x=sort==='added'?(a.created||0):sort==='artistReading'?norm(a.artistReading||a.artist):sort==='title'?norm(a.title):sort==='year'?Number(a.year||0):norm(a.reading||a.title);let y=sort==='added'?(b.created||0):sort==='artistReading'?norm(b.artistReading||b.artist):sort==='title'?norm(b.title):sort==='year'?Number(b.year||0):norm(b.reading||b.title);return (x<y?-1:x>y?1:0)*dir});
 $('count').textContent=`${data.length}曲 / 全${songs.length}曲`;
 $('empty').style.display=data.length?'none':'block';
 $('songRows').innerHTML=data.map(s=>`<tr><td><div class="song">${esc(s.title)}</div><div class="subline">${esc(s.reading||'よみ未設定')}</div>${s.memo?`<div class="subline">${esc(s.memo)}</div>`:''}</td><td>${[s.key1,s.key2].filter(Boolean).map(esc).join(' / ')||'－'}</td><td>${(s.instruments||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')||'－'}</td><td class="status">${esc(s.status||'－')}</td><td>${(s.tags||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')||'－'}</td><td>${esc(s.artist||'－')}<div class="subline">${esc(s.artistReading||'')}</div></td><td>${esc(s.year||'－')}</td><td><button class="rowbtn" data-edit="${s.id}">編集</button> <button class="rowbtn danger" data-delete="${s.id}">削除</button></td></tr>`).join('');
}
KEYS.forEach(()=>{});fillSelect('key1',KEYS);fillSelect('key2',KEYS);checks('instruments',INSTR,'instrument');checks('statuses',STATUS,'status');
$('newBtn').onclick=()=>{openForm(null)};
$('cancelBtn').onclick=closeForm;
$('title').addEventListener('input',()=>{const v=$('title').value.trim();if(!$('reading').dataset.touched && /^[ぁ-ゖァ-ヺー\s]+$/.test(v))$('reading').value=v});
$('reading').addEventListener('input',()=>{$('reading').dataset.touched='1'});
$('artistReading').addEventListener('input',()=>{$('artistReading').dataset.touched='1'});
$('addTagBtn').onclick=()=>{let t=$('newTag').value.trim();if(t&&!tags.includes(t)){tags.push(t);persist();renderTags();$('newTag').value=''}};
$('songForm').onsubmit=e=>{e.preventDefault();let title=$('title').value.trim();if(!title)return;let id=$('editId').value;let old=songs.find(s=>s.id===id);let s={id:id||String(Date.now())+Math.random().toString(16).slice(2),title,reading:$('reading').value.trim(),key1:$('key1').value,key2:$('key2').value,instruments:checked('instrument'),status:checked('status')[0]||'',tags:checked('songTags'),artist:$('artist').value.trim(),artistReading:$('artistReading').value.trim(),year:$('year').value.trim(),memo:$('memo').value.trim(),created:old?.created||Date.now()};s.tags.forEach(t=>{if(!tags.includes(t))tags.push(t)});if(old)songs=songs.map(x=>x.id===id?s:x);else songs.push(s);persist();closeForm();render()};
$('songRows').onclick=e=>{let ed=e.target.dataset.edit,del=e.target.dataset.delete;if(ed){let s=songs.find(x=>x.id===ed);if(s)openForm(s)}if(del&&confirm('この曲を削除する？')){songs=songs.filter(x=>x.id!==del);persist();render()}};
$('tagFilters').onclick=e=>{let t=e.target.dataset.tag;if(t!==undefined){activeTag=activeTag===t?'':t;render()}};
$('clearFilter').onclick=()=>{activeTag='';$('search').value='';render()};
$('search').oninput=render;$('sort').onchange=render;$('direction').onchange=render;
$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({app:'わたしの曲リスト',version:1,songs,tags},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='わたしの曲リスト_バックアップ.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.songs)||!Array.isArray(d.tags))throw Error();if(!confirm('現在の曲データを読み込んだ内容に置き換えるよ。続ける？'))return;songs=d.songs;tags=d.tags;activeTag='';persist();render();alert('読み込みが完了したよ')}catch(err){alert('このファイルは読み込めませんでした')}e.target.value=''};
load();render();
})();
</script>
</body></html>
