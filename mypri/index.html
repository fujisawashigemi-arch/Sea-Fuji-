<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f6f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="./mypriicon.png">
<title>マイプリ</title>

<style>
:root {
  --bg: #f6f3ee;
  --ink: #514b43;
  --accent: #a68d78;
  --line: #e5ddd3;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}

header {
  padding: 15px 16px 10px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: 2px;
}

.version {
  font-size: 10px;
  color: #a69b8e;
  margin-top: 3px;
}

/* 上部ツールバー */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(246,243,238,.97);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 8px 7px;
}

.tool-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.tool-row::-webkit-scrollbar {
  display: none;
}

button, select {
  flex: 0 0 auto;
  border: 1px solid #ddd3c8;
  background: #fffdfa;
  color: var(--ink);
  border-radius: 7px;
  min-height: 34px;
  padding: 5px 8px;
  font-size: 12px;
  font-family: inherit;
}

button:active {
  background: #e9dfd4;
}

button.active {
  background: #e9ded2;
  border-color: var(--accent);
}

button:disabled {
  opacity: .6;
}

select {
  padding-right: 18px;
  min-width: 77px;
}

.tool-separator {
  flex: 0 0 1px;
  height: 23px;
  background: var(--line);
  margin: 0 2px;
}

.adjustment {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 3px;
}

.adjustment button {
  min-width: 30px;
  padding: 5px 6px;
}

.adjust-value {
  min-width: 39px;
  text-align: center;
  font-size: 11px;
  color: #8b7867;
  font-variant-numeric: tabular-nums;
}

#boldBtn {
  min-width: 35px;
  font-size: 15px;
}

#undoBtn, #redoBtn {
  padding-left: 9px;
  padding-right: 9px;
}

#printBtn {
  background: #a68d78;
  color: white;
  border-color: #a68d78;
  padding-left: 12px;
  padding-right: 12px;
}

/* ページ数表示 */
.page-setting {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex: 0 0 auto;
  font-size: 11px;
  color: #8b7867;
}

#pageCount {
  min-width: 65px;
}

/* 編集エリア */
.workspace {
  padding: 18px 10px 40px;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.page {
  width: min(100%, 650px);
  aspect-ratio: 210 / 297;
  flex: 0 0 auto;
  margin: 0 auto;
  padding: 12.7mm;
  background: white;
  box-shadow: 0 3px 15px rgba(70,55,40,.12);
  position: relative;
}

.editor {
  width: 100%;
  height: 100%;
  min-height: 0;
  outline: none;
  border: none;
  font-family: "Hiragino Maru Gothic ProN",
    "Yu Gothic", sans-serif;
  font-size: 16px;
  line-height: 1.8;
  letter-spacing: 0;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  overflow-y: auto;
  color: #333;
}

.editor p,
.editor div:not(.editor) {
  margin-top: 0;
  margin-bottom: var(--paragraph-spacing, 0px);
}

.editor:empty::before {
  content: "ここをタップして文章を入力";
  color: #c5bdb4;
  pointer-events: none;
}

.page-number {
  position: absolute;
  bottom: 4px;
  right: 12.7mm;
  color: #c5bdb4;
  font-size: 10px;
  pointer-events: none;
}

/* 旧印刷エリア用 */
#printArea {
  display: none;
}

/* PDF生成専用エリア */
.pdf-render-area {
  position: absolute;
  left: -12000px;
  top: 0;
  width: 210mm;
  margin: 0;
  padding: 0;
  background: white;
  pointer-events: none;
}

.pdf-render-sheet {
  display: block;
  position: relative;
  box-sizing: border-box;
  width: 210mm;
  height: 297mm;
  margin: 0;
  padding: 12.7mm;
  overflow: hidden;
  background: white;
  color: #333;
}

.pdf-render-editor {
  display: block;
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  min-height: 0;
  max-height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  outline: none;
  border: none;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  color: #333;
}

.pdf-render-editor p,
.pdf-render-editor div {
  margin-top: 0;
}
</style>
</head>

<body>

<header>
  <h1>マイプリ</h1>
  <div class="version">おとりす / Ver. 1.5.0</div>
</header>

<!-- 編集ツール -->
<div class="toolbar">
  <div class="tool-row">

    <select id="fontSize" aria-label="文字サイズ">
      <option value="10">10 pt</option>
      <option value="12">12 pt</option>
      <option value="14">14 pt</option>
      <option value="16" selected>16 pt</option>
      <option value="18">18 pt</option>
      <option value="20">20 pt</option>
      <option value="24">24 pt</option>
      <option value="28">28 pt</option>
      <option value="32">32 pt</option>
      <option value="36">36 pt</option>
    </select>

    <button id="boldBtn"><b>B</b></button>

    <button id="leftBtn" class="active">左</button>
    <button id="centerBtn">中央</button>
    <button id="rightBtn">右</button>

    <span class="tool-separator"></span>

    <div class="adjustment">
      <button id="spaceDown">字−</button>
      <span class="adjust-value" id="letterValue">0.0</span>
      <button id="spaceUp">＋</button>
    </div>

    <span class="tool-separator"></span>

    <div class="adjustment">
      <button id="lineDown">行−</button>
      <span class="adjust-value" id="lineValue">1.80</span>
      <button id="lineUp">＋</button>
    </div>

    <span class="tool-separator"></span>

    <div class="adjustment">
      <button id="paraDown">段−</button>
      <span class="adjust-value" id="paraValue">0px</span>
      <button id="paraUp">＋</button>
    </div>

    <span class="tool-separator"></span>

    <button id="undoBtn">↶</button>
    <button id="redoBtn">↷</button>

    <span class="tool-separator"></span>

    <div class="page-setting">
      ページ
      <select id="pageCount" aria-label="ページ数">
        <option value="1" selected>1ページ</option>
        <option value="2">2ページ</option>
        <option value="3">3ページ</option>
        <option value="4">4ページ</option>
        <option value="5">5ページ</option>
        <option value="6">6ページ</option>
        <option value="7">7ページ</option>
        <option value="8">8ページ</option>
        <option value="9">9ページ</option>
        <option value="10">10ページ</option>
      </select>
    </div>

    <span class="tool-separator"></span>

    <button type="button" id="printBtn">PDF保存</button>

  </div>
</div>

<!-- ページ編集エリア -->
<main class="workspace" id="workspace">
  <section class="page">
    <div
      class="editor"
      contenteditable="true"
      spellcheck="false"
    ></div>
  </section>
</main>

<script>

/* 基本設定 */
const workspace = document.getElementById("workspace");
const pageCountSelect = document.getElementById("pageCount");

let letterSpacing = 0;
let lineHeight = 1.8;
let paragraphSpacing = 0;

let activeEditor = workspace.querySelector(".editor");

/* 編集欄一覧 */
function getEditors() {
  return [...workspace.querySelectorAll(".editor")];
}

/* 現在操作している編集欄 */
workspace.addEventListener("focusin", e => {
  if (e.target.classList.contains("editor")) {
    activeEditor = e.target;
  }
});

/* 編集コマンド */
function focusEditor() {
  if (activeEditor) {
    activeEditor.focus();
  }
}

function command(name, value = null) {
  focusEditor();
  document.execCommand(name, false, value);
}

/* 新しいページを作る */
function createPage(number) {

  const page = document.createElement("section");
  page.className = "page";

  const editor = document.createElement("div");
  editor.className = "editor";
  editor.contentEditable = "true";
  editor.spellcheck = false;

  editor.style.letterSpacing =
    letterSpacing.toFixed(1) + "px";

  editor.style.lineHeight =
    lineHeight.toFixed(2);

  editor.style.setProperty(
    "--paragraph-spacing",
    paragraphSpacing + "px"
  );

  const pageNumber = document.createElement("div");
  pageNumber.className = "page-number";
  pageNumber.textContent = number + " / " + pageCountSelect.value;

  page.appendChild(editor);
  page.appendChild(pageNumber);

  workspace.appendChild(page);

  return editor;
}

/* ページ番号を更新 */
function updatePageNumbers() {
  const pages = [...workspace.querySelectorAll(".page")];

  pages.forEach((page, index) => {
    const number = page.querySelector(".page-number");

    if (number) {
      number.textContent =
        (index + 1) + " / " + pages.length;
    }
  });
}

/* ページ数変更 */
pageCountSelect.addEventListener("change", e => {

  const newCount = Number(e.target.value);
  const editors = getEditors();
  const oldCount = editors.length;

  if (newCount < oldCount) {

    const removedEditors = editors.slice(newCount);

    const hasContent = removedEditors.some(editor => {
      return editor.innerText.trim() !== "";
    });

    if (hasContent) {
      const ok = confirm(
        "削除するページに入力済みの文章があります。\n\n" +
        "ページ数を減らすと、そのページの文章は削除されます。\n\n" +
        "続けますか？"
      );

      if (!ok) {
        pageCountSelect.value = String(oldCount);
        return;
      }
    }

    const pages = [...workspace.querySelectorAll(".page")];

    pages.slice(newCount).forEach(page => {
      page.remove();
    });
  }

  if (newCount > oldCount) {

    for (let i = oldCount; i < newCount; i++) {
      createPage(i + 1);
    }
  }

  activeEditor = getEditors()[0];

  updatePageNumbers();
});

/* 文字サイズ */
document.getElementById("fontSize").addEventListener("change", e => {

  focusEditor();

  const size = e.target.value;

  document.execCommand("fontSize", false, "7");

  activeEditor.querySelectorAll('font[size="7"]').forEach(el => {
    el.removeAttribute("size");
    el.style.fontSize = size + "pt";
  });
});

/* 太字 */
document.getElementById("boldBtn").addEventListener("click", () => {

  command("bold");

  document.getElementById("boldBtn").classList.toggle("active");
});

/* 文字揃え */
function setAlign(value) {

  command("justify" + value);

  ["leftBtn", "centerBtn", "rightBtn"].forEach(id => {
    document.getElementById(id).classList.remove("active");
  });

  const map = {
    Left: "leftBtn",
    Center: "centerBtn",
    Right: "rightBtn"
  };

  document.getElementById(map[value]).classList.add("active");
}

document.getElementById("leftBtn").onclick =
  () => setAlign("Left");

document.getElementById("centerBtn").onclick =
  () => setAlign("Center");

document.getElementById("rightBtn").onclick =
  () => setAlign("Right");

/* 文字間隔 */
function updateLetterSpacing() {

  getEditors().forEach(editor => {
    editor.style.letterSpacing =
      letterSpacing.toFixed(1) + "px";
  });

  document.getElementById("letterValue").textContent =
    letterSpacing.toFixed(1);
}

document.getElementById("spaceUp").onclick = () => {

  letterSpacing = Math.min(
    Math.round((letterSpacing + 0.1) * 10) / 10,
    10
  );

  updateLetterSpacing();
};

document.getElementById("spaceDown").onclick = () => {

  letterSpacing = Math.max(
    Math.round((letterSpacing - 0.1) * 10) / 10,
    -2
  );

  updateLetterSpacing();
};

/* 行間 */
function updateLineHeight() {

  getEditors().forEach(editor => {
    editor.style.lineHeight = lineHeight.toFixed(2);
  });

  document.getElementById("lineValue").textContent =
    lineHeight.toFixed(2);
}

document.getElementById("lineUp").onclick = () => {

  lineHeight = Math.min(
    Math.round((lineHeight + 0.05) * 100) / 100,
    3
  );

  updateLineHeight();
};

document.getElementById("lineDown").onclick = () => {

  lineHeight = Math.max(
    Math.round((lineHeight - 0.05) * 100) / 100,
    1
  );

  updateLineHeight();
};

/* 段落間隔 */
function updateParagraphSpacing() {

  getEditors().forEach(editor => {
    editor.style.setProperty(
      "--paragraph-spacing",
      paragraphSpacing + "px"
    );
  });

  document.getElementById("paraValue").textContent =
    paragraphSpacing + "px";
}

document.getElementById("paraUp").onclick = () => {

  paragraphSpacing = Math.min(paragraphSpacing + 1, 60);

  updateParagraphSpacing();
};

document.getElementById("paraDown").onclick = () => {

  paragraphSpacing = Math.max(paragraphSpacing - 1, 0);

  updateParagraphSpacing();
};

/* 元に戻す・やり直し */
document.getElementById("undoBtn").onclick =
  () => command("undo");

document.getElementById("redoBtn").onclick =
  () => command("redo");

/* PDFファイル名 */
function getPdfFileName() {

  const firstEditor = getEditors()[0];

  const text = firstEditor.innerText ||
    firstEditor.textContent || "";

  const firstLine = text
    .replace(/\r/g, "")
    .split("\n")[0]
    .trim();

  let name = firstLine || "名称未設定";

  name = name.replace(/[\\/:*?"<>|]/g, "_");

  if (!name.toLowerCase().endsWith(".pdf")) {
    name += ".pdf";
  }

  return name;
}

/* 外部ライブラリ読み込み */
function loadScript(src, test) {

  if (test()) {
    return Promise.resolve();
  }

  return new Promise((resolve, reject) => {

    const existing = document.querySelector(
      'script[src="' + src + '"]'
    );

    if (existing) {
      existing.addEventListener("load", resolve, { once: true });
      existing.addEventListener("error", reject, { once: true });
      return;
    }

    const script = document.createElement("script");

    script.src = src;
    script.onload = resolve;
    script.onerror = () => reject(
      new Error("ライブラリを読み込めませんでした")
    );

    document.head.appendChild(script);
  });
}

async function loadPdfLibraries() {

  await loadScript(
    "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
    () => typeof window.html2canvas === "function"
  );

  await loadScript(
    "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js",
    () => !!(window.jspdf && window.jspdf.jsPDF)
  );
}

/* PDF用ページを作成 */
function createPdfRenderArea() {

  const area = document.createElement("div");
  area.className = "pdf-render-area";

  const editors = getEditors();

  editors.forEach(sourceEditor => {

    const sheet = document.createElement("section");
    sheet.className = "pdf-render-sheet";

    const editor = document.createElement("div");
    editor.className = "pdf-render-editor";

    editor.innerHTML = sourceEditor.innerHTML;

    const computed = window.getComputedStyle(sourceEditor);

    editor.style.fontFamily = computed.fontFamily;
    editor.style.fontSize = computed.fontSize;
    editor.style.fontWeight = computed.fontWeight;
    editor.style.lineHeight = computed.lineHeight;
    editor.style.letterSpacing = computed.letterSpacing;
    editor.style.color = computed.color;
    editor.style.textAlign = computed.textAlign;
    editor.style.whiteSpace = "pre-wrap";
    editor.style.overflowWrap = "break-word";

    const paragraphSpacing =
      computed.getPropertyValue("--paragraph-spacing") || "0px";

    editor.querySelectorAll("p, div").forEach(element => {
      element.style.marginTop = "0";
      element.style.marginBottom = paragraphSpacing;
    });

    sheet.appendChild(editor);
    area.appendChild(sheet);
  });

  document.body.appendChild(area);

  return area;
}

/* PDF生成 */
async function generatePdf(fileName) {

  let renderArea = null;

  try {

    await loadPdfLibraries();

    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }

    renderArea = createPdfRenderArea();

    await new Promise(resolve => {
      requestAnimationFrame(() => {
        requestAnimationFrame(resolve);
      });
    });

    const jsPDF = window.jspdf.jsPDF;

    const pdf = new jsPDF({
      orientation: "portrait",
      unit: "mm",
      format: "a4",
      compress: true
    });

    pdf.setProperties({
      title: fileName.replace(/\.pdf$/i, ""),
      subject: "マイプリで作成した書類",
      creator: "おとりす / マイプリ"
    });

    const sheets = [
      ...renderArea.querySelectorAll(".pdf-render-sheet")
    ];

    for (let i = 0; i < sheets.length; i++) {

      const sheet = sheets[i];

      const canvas = await window.html2canvas(sheet, {
        scale: 2,
        backgroundColor: "#ffffff",
        useCORS: true,
        logging: false,
        scrollX: 0,
        scrollY: 0
      });

      const imageData = canvas.toDataURL("image/png");

      if (i > 0) {
        pdf.addPage("a4", "portrait");
      }

      pdf.addImage(
        imageData,
        "PNG",
        0,
        0,
        210,
        297,
        undefined,
        "FAST"
      );

      canvas.width = 0;
      canvas.height = 0;
    }

    const blob = pdf.output("blob");

    return blob;

  } finally {

    if (renderArea) {
      renderArea.remove();
    }
  }
}

/* PDF保存ボタン */
document.getElementById("printBtn").addEventListener("click", async function(e) {

  e.preventDefault();

  const button = this;
  const originalText = button.textContent;

  const defaultName = getPdfFileName();

  const inputName = window.prompt(
    "PDFのファイル名を確認・変更してね。",
    defaultName
  );

  if (inputName === null) {
    return;
  }

  let fileName = inputName.trim();

  if (!fileName) {
    fileName = "名称未設定.pdf";
  }

  fileName = fileName.replace(/[\\/:*?"<>|]/g, "_");

  if (!fileName.toLowerCase().endsWith(".pdf")) {
    fileName += ".pdf";
  }

  if (activeEditor) {
    activeEditor.blur();
  }

  /* iOSのポップアップ制限に備えて先に開く */
  let pdfWindow = null;

  try {
    pdfWindow = window.open("about:blank", "_blank");
  } catch (error) {
    pdfWindow = null;
  }

  button.disabled = true;
  button.textContent = "PDF作成中…";

  try {

    const blob = await generatePdf(fileName);

    const url = URL.createObjectURL(blob);

    if (pdfWindow && !pdfWindow.closed) {

      pdfWindow.location.href = url;

    } else {

      const link = document.createElement("a");

      link.href = url;
      link.download = fileName;
      link.style.display = "none";

      document.body.appendChild(link);
      link.click();
      link.remove();

    }

    /* PDF表示に必要な時間を確保してからURLを解放 */
    setTimeout(() => {
      URL.revokeObjectURL(url);
    }, 60000);

  } catch (error) {

    if (pdfWindow && !pdfWindow.closed) {
      pdfWindow.close();
    }

    console.error(error);

    alert(
      "PDFを作成できなかったよ。\n\n" +
      "インターネット接続を確認して、もう一度試してみてね。\n\n" +
      "エラー：" + (error.message || error)
    );

  } finally {

    button.disabled = false;
    button.textContent = originalText;

  }

});

/* 初期ページ番号 */
updatePageNumbers();

</script>

</body>
</html>
