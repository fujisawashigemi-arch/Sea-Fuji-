
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f6f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="./mypriicon.png">
<title>マイプリ</title>

<style>
:root {
  --bg: #f6f3ee;
  --ink: #514b43;
  --accent: #a68d78;
  --line: #e5ddd3;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}

header {
  padding: 15px 16px 10px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: 2px;
}

.version {
  font-size: 10px;
  color: #a69b8e;
  margin-top: 3px;
}

.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(246,243,238,.97);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 9px 10px;
}

.tool-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.tool-row:last-child {
  margin-bottom: 0;
}

button, select {
  border: 1px solid #ddd3c8;
  background: #fffdfa;
  color: var(--ink);
  border-radius: 8px;
  min-height: 36px;
  padding: 6px 11px;
  font-size: 13px;
}

button:active {
  background: #e9dfd4;
}

button.active {
  background: #e9ded2;
  border-color: var(--accent);
}

select {
  padding-right: 22px;
}

.adjustment {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.adjust-value {
  min-width: 43px;
  text-align: center;
  font-size: 12px;
  color: #8b7867;
  font-variant-numeric: tabular-nums;
}

.workspace {
  padding: 18px 10px 40px;
  overflow-x: hidden;
}

.page {
  width: min(100%, 650px);
  aspect-ratio: 210 / 297;
  margin: 0 auto;
  padding: 12.7mm;
  background: white;
  box-shadow: 0 3px 15px rgba(70,55,40,.12);
  position: relative;
}

.editor {
  width: 100%;
  height: 100%;
  min-height: 0;
  outline: none;
  border: none;
  font-family: "Hiragino Maru Gothic ProN",
    "Yu Gothic", sans-serif;
  font-size: 16px;
  line-height: 1.8;
  letter-spacing: 0;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  color: #333;
}

/* 段落間隔 */
.editor p,
.editor div:not(.editor) {
  margin-top: 0;
  margin-bottom: var(--paragraph-spacing, 0px);
}

.editor:empty::before {
  content: "ここをタップして文章を入力";
  color: #c5bdb4;
  pointer-events: none;
}

.footer {
  text-align: center;
  font-size: 11px;
  color: #a69b8e;
  padding: 18px;
}

@media print {
  html, body {
    background: white;
    margin: 0;
    padding: 0;
  }

  header, .toolbar, .footer {
    display: none !important;
  }

  .workspace {
    padding: 0;
    margin: 0;
  }

  .page {
    width: 210mm;
    height: 297mm;
    padding: 12.7mm;
    margin: 0;
    box-shadow: none;
    page-break-after: always;
    break-after: page;
  }

  .editor {
    min-height: 0;
  }

  @page {
    size: A4 portrait;
    margin: 0;
  }
}
</style>
</head>

<body>

<header>
  <h1>マイプリ</h1>
  <div class="version">おとりす / Ver. 1.2</div>
</header>

<div class="toolbar">

  <div class="tool-row">
    <select id="fontSize" aria-label="文字サイズ">
      <option value="10">10 pt</option>
      <option value="12">12 pt</option>
      <option value="14">14 pt</option>
      <option value="16" selected>16 pt</option>
      <option value="18">18 pt</option>
      <option value="20">20 pt</option>
      <option value="24">24 pt</option>
      <option value="28">28 pt</option>
      <option value="32">32 pt</option>
      <option value="36">36 pt</option>
    </select>

    <button id="boldBtn"><b>B</b></button>
    <button id="leftBtn" class="active">左</button>
    <button id="centerBtn">中央</button>
    <button id="rightBtn">右</button>
  </div>

  <div class="tool-row">

    <div class="adjustment">
      <button id="spaceDown">文字間 −</button>
      <span class="adjust-value" id="letterValue">0.0px</span>
      <button id="spaceUp">＋</button>
    </div>

    <div class="adjustment">
      <button id="lineDown">行間 −</button>
      <span class="adjust-value" id="lineValue">1.80</span>
      <button id="lineUp">＋</button>
    </div>

  </div>

  <div class="tool-row">

    <div class="adjustment">
      <button id="paraDown">段落間 −</button>
      <span class="adjust-value" id="paraValue">0px</span>
      <button id="paraUp">＋</button>
    </div>

    <button id="undoBtn">元に戻す</button>
    <button id="redoBtn">やり直し</button>
    <button id="printBtn">PDF・印刷</button>

  </div>

</div>

<main class="workspace">
  <section class="page">
    <div
      class="editor"
      id="editor"
      contenteditable="true"
      spellcheck="false"
    ></div>
  </section>
</main>

<div class="footer">
  おとりす ｜ マイプリ
</div>

<script>
const editor = document.getElementById("editor");

let letterSpacing = 0;
let lineHeight = 1.8;
let paragraphSpacing = 0;

function focusEditor() {
  editor.focus();
}

function command(name, value = null) {
  focusEditor();
  document.execCommand(name, false, value);
}

// 文字サイズ（Ver.1.1から変更なし）
document.getElementById("fontSize").addEventListener("change", e => {
  focusEditor();
  const size = e.target.value;

  document.execCommand("fontSize", false, "7");

  editor.querySelectorAll('font[size="7"]').forEach(el => {
    el.removeAttribute("size");
    el.style.fontSize = size + "pt";
  });
});

// 太字
document.getElementById("boldBtn").addEventListener("click", () => {
  command("bold");
  document.getElementById("boldBtn").classList.toggle("active");
});

// 文字揃え
function setAlign(value) {
  command("justify" + value);

  ["leftBtn", "centerBtn", "rightBtn"].forEach(id => {
    document.getElementById(id).classList.remove("active");
  });

  const map = {
    Left: "leftBtn",
    Center: "centerBtn",
    Right: "rightBtn"
  };

  document.getElementById(map[value]).classList.add("active");
}

document.getElementById("leftBtn").onclick =
  () => setAlign("Left");

document.getElementById("centerBtn").onclick =
  () => setAlign("Center");

document.getElementById("rightBtn").onclick =
  () => setAlign("Right");

// 文字間隔 0.1px刻み
function updateLetterSpacing() {
  editor.style.letterSpacing = letterSpacing.toFixed(1) + "px";
  document.getElementById("letterValue").textContent =
    letterSpacing.toFixed(1) + "px";
}

document.getElementById("spaceUp").onclick = () => {
  letterSpacing = Math.min(
    Math.round((letterSpacing + 0.1) * 10) / 10,
    10
  );
  updateLetterSpacing();
};

document.getElementById("spaceDown").onclick = () => {
  letterSpacing = Math.max(
    Math.round((letterSpacing - 0.1) * 10) / 10,
    -2
  );
  updateLetterSpacing();
};

// 行間 0.05刻み
function updateLineHeight() {
  editor.style.lineHeight = lineHeight.toFixed(2);
  document.getElementById("lineValue").textContent =
    lineHeight.toFixed(2);
}

document.getElementById("lineUp").onclick = () => {
  lineHeight = Math.min(
    Math.round((lineHeight + 0.05) * 100) / 100,
    3
  );
  updateLineHeight();
};

document.getElementById("lineDown").onclick = () => {
  lineHeight = Math.max(
    Math.round((lineHeight - 0.05) * 100) / 100,
    1
  );
  updateLineHeight();
};

// 段落間隔 1px刻み
function updateParagraphSpacing() {
  editor.style.setProperty(
    "--paragraph-spacing",
    paragraphSpacing + "px"
  );

  document.getElementById("paraValue").textContent =
    paragraphSpacing + "px";
}

document.getElementById("paraUp").onclick = () => {
  paragraphSpacing = Math.min(paragraphSpacing + 1, 60);
  updateParagraphSpacing();
};

document.getElementById("paraDown").onclick = () => {
  paragraphSpacing = Math.max(paragraphSpacing - 1, 0);
  updateParagraphSpacing();
};

// 元に戻す・やり直す
document.getElementById("undoBtn").onclick =
  () => command("undo");

document.getElementById("redoBtn").onclick =
  () => command("redo");

// 印刷
document.getElementById("printBtn").onclick = () => {
  window.print();
};
</script>

</body>
</html>
