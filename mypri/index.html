
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f6f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="./mypriicon.png">
<title>マイプリ</title>

<style>
:root {
  --bg: #f6f3ee;
  --ink: #514b43;
  --accent: #a68d78;
  --line: #e5ddd3;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}

header {
  padding: 15px 16px 10px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: 2px;
}

.version {
  font-size: 10px;
  color: #a69b8e;
  margin-top: 3px;
}

/* 上部一列ツールバー */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(246,243,238,.97);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 8px 7px;
}

.tool-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.tool-row::-webkit-scrollbar {
  display: none;
}

button, select {
  flex: 0 0 auto;
  border: 1px solid #ddd3c8;
  background: #fffdfa;
  color: var(--ink);
  border-radius: 7px;
  min-height: 34px;
  padding: 5px 8px;
  font-size: 12px;
  font-family: inherit;
}

button:active {
  background: #e9dfd4;
}

button.active {
  background: #e9ded2;
  border-color: var(--accent);
}

select {
  padding-right: 18px;
  min-width: 77px;
}

.tool-separator {
  flex: 0 0 1px;
  height: 23px;
  background: var(--line);
  margin: 0 2px;
}

.adjustment {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 3px;
}

.adjustment button {
  min-width: 30px;
  padding: 5px 6px;
}

.adjust-value {
  min-width: 39px;
  text-align: center;
  font-size: 11px;
  color: #8b7867;
  font-variant-numeric: tabular-nums;
}

#boldBtn {
  min-width: 35px;
  font-size: 15px;
}

#undoBtn, #redoBtn {
  padding-left: 9px;
  padding-right: 9px;
}

#printBtn {
  background: #a68d78;
  color: white;
  border-color: #a68d78;
  padding-left: 12px;
  padding-right: 12px;
}

.workspace {
  padding: 18px 10px 40px;
  overflow-x: hidden;
}

.page {
  width: min(100%, 650px);
  aspect-ratio: 210 / 297;
  margin: 0 auto;
  padding: 12.7mm;
  background: white;
  box-shadow: 0 3px 15px rgba(70,55,40,.12);
  position: relative;
}

.editor {
  width: 100%;
  height: 100%;
  min-height: 0;
  outline: none;
  border: none;
  font-family: "Hiragino Maru Gothic ProN",
    "Yu Gothic", sans-serif;
  font-size: 16px;
  line-height: 1.8;
  letter-spacing: 0;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  color: #333;
}

.editor p,
.editor div:not(.editor) {
  margin-top: 0;
  margin-bottom: var(--paragraph-spacing, 0px);
}

.editor:empty::before {
  content: "ここをタップして文章を入力";
  color: #c5bdb4;
  pointer-events: none;
}

.footer {
  text-align: center;
  font-size: 11px;
  color: #a69b8e;
  padding: 18px;
}

/* 印刷設定 */
@media print {
  html, body {
    background: white !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  header, .toolbar, .footer {
    display: none !important;
  }

  .workspace {
    padding: 0 !important;
    margin: 0 !important;
    overflow: visible !important;
  }

  .page {
    width: 210mm !important;
    height: 297mm !important;
    padding: 12.7mm !important;
    margin: 0 !important;
    box-shadow: none !important;
    page-break-after: always;
    break-after: page;
  }

  .editor {
    min-height: 0;
  }

  @page {
    size: A4 portrait;
    margin: 0;
  }
}
</style>
</head>

<body>

<header>
  <h1>マイプリ</h1>
  <div class="version">おとりす / Ver. 1.3.1</div>
</header>

<!-- 編集ツール一列 -->
<div class="toolbar">
  <div class="tool-row">

    <select id="fontSize" aria-label="文字サイズ">
      <option value="10">10 pt</option>
      <option value="12">12 pt</option>
      <option value="14">14 pt</option>
      <option value="16" selected>16 pt</option>
      <option value="18">18 pt</option>
      <option value="20">20 pt</option>
      <option value="24">24 pt</option>
      <option value="28">28 pt</option>
      <option value="32">32 pt</option>
      <option value="36">36 pt</option>
    </select>

    <button id="boldBtn"><b>B</b></button>

    <button id="leftBtn" class="active">左</button>
    <button id="centerBtn">中央</button>
    <button id="rightBtn">右</button>

    <span class="tool-separator"></span>

    <div class="adjustment">
      <button id="spaceDown">字−</button>
      <span class="adjust-value" id="letterValue">0.0</span>
      <button id="spaceUp">＋</button>
    </div>

    <span class="tool-separator"></span>

    <div class="adjustment">
      <button id="lineDown">行−</button>
      <span class="adjust-value" id="lineValue">1.80</span>
      <button id="lineUp">＋</button>
    </div>

    <span class="tool-separator"></span>

    <div class="adjustment">
      <button id="paraDown">段−</button>
      <span class="adjust-value" id="paraValue">0px</span>
      <button id="paraUp">＋</button>
    </div>

    <span class="tool-separator"></span>

    <button id="undoBtn">↶</button>
    <button id="redoBtn">↷</button>

    <span class="tool-separator"></span>

    <button type="button" id="printBtn">PDF保存</button>

  </div>
</div>

<main class="workspace">
  <section class="page">
    <div
      class="editor"
      id="editor"
      contenteditable="true"
      spellcheck="false"
    ></div>
  </section>
</main>

<div class="footer">
  おとりす ｜ マイプリ
</div>

<script>
const editor = document.getElementById("editor");

let letterSpacing = 0;
let lineHeight = 1.8;
let paragraphSpacing = 0;

function focusEditor() {
  editor.focus();
}

function command(name, value = null) {
  focusEditor();
  document.execCommand(name, false, value);
}

/* 文字サイズ */
document.getElementById("fontSize").addEventListener("change", e => {
  focusEditor();

  const size = e.target.value;

  document.execCommand("fontSize", false, "7");

  editor.querySelectorAll('font[size="7"]').forEach(el => {
    el.removeAttribute("size");
    el.style.fontSize = size + "pt";
  });
});

/* 太字 */
document.getElementById("boldBtn").addEventListener("click", () => {
  command("bold");
  document.getElementById("boldBtn").classList.toggle("active");
});

/* 文字揃え */
function setAlign(value) {
  command("justify" + value);

  ["leftBtn", "centerBtn", "rightBtn"].forEach(id => {
    document.getElementById(id).classList.remove("active");
  });

  const map = {
    Left: "leftBtn",
    Center: "centerBtn",
    Right: "rightBtn"
  };

  document.getElementById(map[value]).classList.add("active");
}

document.getElementById("leftBtn").onclick =
  () => setAlign("Left");

document.getElementById("centerBtn").onclick =
  () => setAlign("Center");

document.getElementById("rightBtn").onclick =
  () => setAlign("Right");

/* 文字間隔 */
function updateLetterSpacing() {
  editor.style.letterSpacing =
    letterSpacing.toFixed(1) + "px";

  document.getElementById("letterValue").textContent =
    letterSpacing.toFixed(1);
}

document.getElementById("spaceUp").onclick = () => {
  letterSpacing = Math.min(
    Math.round((letterSpacing + 0.1) * 10) / 10,
    10
  );
  updateLetterSpacing();
};

document.getElementById("spaceDown").onclick = () => {
  letterSpacing = Math.max(
    Math.round((letterSpacing - 0.1) * 10) / 10,
    -2
  );
  updateLetterSpacing();
};

/* 行間 */
function updateLineHeight() {
  editor.style.lineHeight = lineHeight.toFixed(2);

  document.getElementById("lineValue").textContent =
    lineHeight.toFixed(2);
}

document.getElementById("lineUp").onclick = () => {
  lineHeight = Math.min(
    Math.round((lineHeight + 0.05) * 100) / 100,
    3
  );
  updateLineHeight();
};

document.getElementById("lineDown").onclick = () => {
  lineHeight = Math.max(
    Math.round((lineHeight - 0.05) * 100) / 100,
    1
  );
  updateLineHeight();
};

/* 段落間隔 */
function updateParagraphSpacing() {
  editor.style.setProperty(
    "--paragraph-spacing",
    paragraphSpacing + "px"
  );

  document.getElementById("paraValue").textContent =
    paragraphSpacing + "px";
}

document.getElementById("paraUp").onclick = () => {
  paragraphSpacing = Math.min(paragraphSpacing + 1, 60);
  updateParagraphSpacing();
};

document.getElementById("paraDown").onclick = () => {
  paragraphSpacing = Math.max(paragraphSpacing - 1, 0);
  updateParagraphSpacing();
};

/* 元に戻す・やり直し */
document.getElementById("undoBtn").onclick =
  () => command("undo");

document.getElementById("redoBtn").onclick =
  () => command("redo");

/* PDFファイル名の取得 */
function getPdfFileName() {
  const text = editor.innerText || editor.textContent || "";

  const firstLine = text
    .replace(/\r/g, "")
    .split("\n")[0]
    .trim();

  let name = firstLine || "名称未設定";

  name = name.replace(/[\\/:*?"<>|]/g, "_");

  if (!name.toLowerCase().endsWith(".pdf")) {
    name += ".pdf";
  }

  return name;
}

/* PDF保存 */
document.getElementById("printBtn").addEventListener("click", function(e) {
  e.preventDefault();

  const defaultName = getPdfFileName();

  const inputName = window.prompt(
    "PDFのファイル名を確認・変更してね。\n\n保存先は次の印刷画面から選択できるよ。",
    defaultName
  );

  if (inputName === null) {
    return;
  }

  let fileName = inputName.trim();

  if (!fileName) {
    fileName = "名称未設定.pdf";
  }

  fileName = fileName.replace(/[\\/:*?"<>|]/g, "_");

  if (!fileName.toLowerCase().endsWith(".pdf")) {
    fileName += ".pdf";
  }

  const originalTitle = document.title;
  document.title = fileName.replace(/\.pdf$/i, "");

  editor.blur();

  setTimeout(() => {
    window.print();
  }, 300);

  window.addEventListener("afterprint", function restoreTitle() {
    document.title = originalTitle;
    window.removeEventListener("afterprint", restoreTitle);
  });
});
</script>

</body>
</html>
