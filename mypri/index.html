
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f6f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="./mypriicon.png">
<title>マイプリ</title>

<style>
:root {
  --bg: #f6f3ee;
  --ink: #514b43;
  --accent: #a68d78;
  --line: #e5ddd3;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}

header {
  padding: 7px 12px 5px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 2px;
}

.version {
  font-size: 9px;
  color: #a69b8e;
  margin-top: 1px;
}

.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(246,243,238,.97);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 6px 5px;
}

.tool-row {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: nowrap;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.tool-row::-webkit-scrollbar {
  display: none;
}

button, select {
  flex: 0 0 auto;
  border: 1px solid #ddd3c8;
  background: #fffdfa;
  color: var(--ink);
  border-radius: 7px;
  min-height: 34px;
  padding: 5px 9px;
  font-size: 12px;
}

button:active {
  background: #e9dfd4;
}

button.active {
  background: #e9ded2;
  border-color: var(--accent);
}

select {
  padding-right: 18px;
  min-width: 75px;
}

.tool-separator {
  width: 1px;
  height: 23px;
  background: #ded5cb;
  flex: 0 0 1px;
  margin: 0 2px;
}

.workspace {
  padding: 12px 10px 40px;
  overflow-x: hidden;
}

.page {
  width: min(100%, 650px);
  aspect-ratio: 210 / 297;
  margin: 0 auto;
  padding: 12.7mm;
  background: white;
  box-shadow: 0 3px 15px rgba(70,55,40,.12);
  position: relative;
}

.editor {
  width: 100%;
  height: 100%;
  min-height: 0;
  outline: none;
  border: none;
  font-family: "Hiragino Maru Gothic ProN",
    "Yu Gothic", sans-serif;
  font-size: 16px;
  line-height: 1.8;
  letter-spacing: 0;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  color: #333;
}

.editor:empty::before {
  content: "ここをタップして文章を入力";
  color: #c5bdb4;
  pointer-events: none;
}

.editor span {
  display: inline;
}

.footer {
  text-align: center;
  font-size: 11px;
  color: #a69b8e;
  padding: 18px;
}

@media print {
  html, body {
    background: white;
    margin: 0;
    padding: 0;
  }

  header, .toolbar, .footer {
    display: none !important;
  }

  .workspace {
    padding: 0;
    margin: 0;
  }

  .page {
    width: 210mm;
    height: 297mm;
    padding: 12.7mm;
    margin: 0;
    box-shadow: none;
    page-break-after: always;
    break-after: page;
  }

  .editor {
    min-height: 0;
  }

  @page {
    size: A4 portrait;
    margin: 0;
  }
}
</style>
</head>

<body>

<header>
  <h1>マイプリ</h1>
  <div class="version">おとりす / Ver. 1.2</div>
</header>

<div class="toolbar">
  <div class="tool-row">

    <select id="fontSize" aria-label="文字サイズ">
      <option value="10">10 pt</option>
      <option value="12">12 pt</option>
      <option value="14">14 pt</option>
      <option value="16" selected>16 pt</option>
      <option value="18">18 pt</option>
      <option value="20">20 pt</option>
      <option value="24">24 pt</option>
      <option value="28">28 pt</option>
      <option value="32">32 pt</option>
      <option value="36">36 pt</option>
    </select>

    <button id="boldBtn"><b>B</b></button>

    <span class="tool-separator"></span>

    <button id="leftBtn" class="active">左</button>
    <button id="centerBtn">中央</button>
    <button id="rightBtn">右</button>

    <span class="tool-separator"></span>

    <button id="spaceDown">文字間 −</button>
    <button id="spaceUp">文字間 ＋</button>

    <span class="tool-separator"></span>

    <button id="lineDown">行間 −</button>
    <button id="lineUp">行間 ＋</button>

    <button id="paraDown">段落間 −</button>
    <button id="paraUp">段落間 ＋</button>

    <span class="tool-separator"></span>

    <button id="undoBtn">↶</button>
    <button id="redoBtn">↷</button>
    <button id="printBtn">PDF・印刷</button>

  </div>
</div>

<main class="workspace">
  <section class="page">
    <div
      class="editor"
      id="editor"
      contenteditable="true"
      spellcheck="false"
    ></div>
  </section>
</main>

<div class="footer">
  おとりす ｜ マイプリ
</div>

<script>
const editor = document.getElementById("editor");

let savedRange = null;

const fontSize = document.getElementById("fontSize");

function selectionInsideEditor() {
  const selection = window.getSelection();

  return selection &&
    selection.rangeCount > 0 &&
    editor.contains(selection.anchorNode) &&
    editor.contains(selection.focusNode);
}

function saveSelection() {
  const selection = window.getSelection();

  if (selectionInsideEditor()) {
    savedRange = selection.getRangeAt(0).cloneRange();
  }
}

function restoreSelection() {
  if (!savedRange) return false;

  if (!editor.contains(savedRange.commonAncestorContainer)) {
    savedRange = null;
    return false;
  }

  const selection = window.getSelection();

  selection.removeAllRanges();
  selection.addRange(savedRange);

  return true;
}

document.addEventListener("selectionchange", () => {
  saveSelection();
});

editor.addEventListener("keyup", saveSelection);
editor.addEventListener("mouseup", saveSelection);
editor.addEventListener("touchend", () => {
  setTimeout(saveSelection, 50);
});

function withSelection(callback) {
  editor.focus();

  if (!restoreSelection()) {
    return;
  }

  callback();

  saveSelection();
}

function command(name, value = null) {
  withSelection(() => {
    document.execCommand(name, false, value);
  });
}

// ボタン操作時に選択範囲を失わない
document.querySelectorAll(".toolbar button, .toolbar select")
  .forEach(control => {
    control.addEventListener("mousedown", e => {
      e.preventDefault();
      saveSelection();
    });
  });

// 文字サイズ
fontSize.addEventListener("change", () => {
  const size = fontSize.value;

  withSelection(() => {
    document.execCommand("fontSize", false, "7");

    editor.querySelectorAll('font[size="7"]').forEach(el => {
      el.removeAttribute("size");
      el.style.fontSize = size + "pt";
    });
  });
});

// 太字
document.getElementById("boldBtn").addEventListener("click", () => {
  command("bold");
});

// 文字揃え
function setAlign(value) {
  withSelection(() => {
    document.execCommand("justify" + value, false, null);
  });

  ["leftBtn", "centerBtn", "rightBtn"].forEach(id => {
    document.getElementById(id).classList.remove("active");
  });

  const map = {
    Left: "leftBtn",
    Center: "centerBtn",
    Right: "rightBtn"
  };

  document.getElementById(map[value]).classList.add("active");
}

document.getElementById("leftBtn").onclick =
  () => setAlign("Left");

document.getElementById("centerBtn").onclick =
  () => setAlign("Center");

document.getElementById("rightBtn").onclick =
  () => setAlign("Right");

// 選択した文字に文字間隔を適用
function changeLetterSpacing(amount) {
  withSelection(() => {
    const selection = window.getSelection();

    if (!selection || selection.isCollapsed) {
      alert("文字間隔を変更する文字を選択してね。");
      return;
    }

    const range = selection.getRangeAt(0);

    if (!editor.contains(range.commonAncestorContainer)) return;

    const span = document.createElement("span");
    span.style.letterSpacing = amount + "px";

    try {
      const contents = range.extractContents();
      span.appendChild(contents);
      range.insertNode(span);

      selection.removeAllRanges();

      const newRange = document.createRange();
      newRange.selectNodeContents(span);
      selection.addRange(newRange);

      saveSelection();
    } catch (e) {
      alert("この選択範囲には文字間隔を設定できませんでした。");
    }
  });
}

document.getElementById("spaceUp").onclick = () => {
  changeLetterSpacing(1);
};

document.getElementById("spaceDown").onclick = () => {
  changeLetterSpacing(-1);
};

// 選択した段落を取得
function getSelectedParagraphs() {
  const selection = window.getSelection();

  if (!selection || !editor.contains(selection.anchorNode)) {
    return [];
  }

  const range = selection.getRangeAt(0);

  if (range.collapsed) return [];

  const blocks = [];
  const walker = document.createTreeWalker(
    editor,
    NodeFilter.SHOW_ELEMENT,
    {
      acceptNode(node) {
        if (
          ["P", "DIV"].includes(node.tagName) &&
          !node.classList.contains("editor")
        ) {
          return NodeFilter.FILTER_ACCEPT;
        }
        return NodeFilter.FILTER_SKIP;
      }
    }
  );

  while (walker.nextNode()) {
    const block = walker.currentNode;

    if (range.intersectsNode(block)) {
      blocks.push(block);
    }
  }

  if (blocks.length === 0) {
    let node = range.startContainer;

    if (node.nodeType === Node.TEXT_NODE) {
      node = node.parentElement;
    }

    while (node && node !== editor) {
      if (["P", "DIV"].includes(node.tagName)) {
        blocks.push(node);
        break;
      }
      node = node.parentElement;
    }
  }

  return blocks;
}

// 選択した段落のスタイル変更
function changeParagraphStyle(property, amount, minimum, maximum) {
  withSelection(() => {
    const blocks = getSelectedParagraphs();

    if (blocks.length === 0) {
      alert("変更したい段落を選択してね。");
      return;
    }

    blocks.forEach(block => {
      const current = parseFloat(
        getComputedStyle(block)[property]
      ) || (property === "lineHeight" ? 1.8 : 0);

      let next = current + amount;

      next = Math.max(minimum, Math.min(maximum, next));

      if (property === "lineHeight") {
        block.style.lineHeight = next.toFixed(2);
      } else {
        block.style[property] = next.toFixed(1) + "px";
      }
    });

    saveSelection();
  });
}

// 行間
document.getElementById("lineUp").onclick = () => {
  changeParagraphStyle("lineHeight", 0.1, 1, 3);
};

document.getElementById("lineDown").onclick = () => {
  changeParagraphStyle("lineHeight", -0.1, 1, 3);
};

// 段落間隔（段落の下側）
document.getElementById("paraUp").onclick = () => {
  changeParagraphStyle("marginBottom", 2, 0, 60);
};

document.getElementById("paraDown").onclick = () => {
  changeParagraphStyle("marginBottom", -2, 0, 60);
};

// 元に戻す・やり直す
document.getElementById("undoBtn").onclick = () => {
  command("undo");
};

document.getElementById("redoBtn").onclick = () => {
  command("redo");
};

// 印刷
document.getElementById("printBtn").onclick = () => {
  window.print();
};

</script>

</body>
</html>
